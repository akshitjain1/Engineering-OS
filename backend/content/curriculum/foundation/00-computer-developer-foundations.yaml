              - Compilers forbid files.
              - Hexadecimal disk mode.
              answer: The kernel provides controlled access so programs cannot corrupt the machine at
                will.
              explanation: Protection and sharing.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-kernel-q3
              prompt: 'A crash in a user process vs a kernel panic: which is usually worse for the whole
                machine?'
              options:
              - User process crash always stops all other apps by hardware law
              - Kernel failure can take down the system; a user crash is usually isolated
              - They are identical
              - Only Git panics
              answer: Kernel failure can take down the system; a user crash is usually isolated
              explanation: Privilege.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-kernel-q4
              prompt: 'ls and bash are:'
              options:
              - The kernel itself
              - User programs that request kernel services
              - CPU registers
              - SSD firmware only
              answer: User programs that request kernel services
              explanation: Shell lecture programs.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-kernel-ex1
              title: Kernel in one page
              instructions: 'Write a half-page: what the kernel does, what a user program does, and one
                example of something only the kernel should do (schedule processes, talk to devices, enforce
                permissions). Do not claim Missing Semester taught kernel internals.'
              difficulty: beginner
              order: 0
        - slug: cf-os-processes
          name: Processes
          description: The OS creates, schedules, and isolates processes. Each process has an identity
            and resources.
          order: 1
          prerequisites:
          - cf-kernel
          learning_objective: Describe how the OS manages processes.
          mastery_criteria:
          - Explain process creation at a high level.
          - Contrast process and program.
          - Score >= 80%.
          next_topic: cf-threads
          fast_trackable: true
          lessons:
          - slug: cf-os-processes-core
            title: Processes
            description: The OS creates, schedules, and isolates processes. Each process has an identity
              and resources.
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: cf-os-processes-primary
              title: MIT Missing Semester 2026 — Introduction to the Shell
              type: article
              url: https://missing.csail.mit.edu/2026/course-shell/
              provider: MIT Missing Semester 2026
              role: PRIMARY
              description: Commands run as processes. Pair with ps later.
              official: true
              order: 0
            questions:
            - slug: cf-os-processes-q1
              prompt: 'Isolation between processes mainly means:'
              options:
              - They share one PID
              - One process's memory is not freely writable by another
              - They cannot use the CPU
              - They cannot be listed
              answer: One process's memory is not freely writable by another
              explanation: OS isolation.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-os-processes-q2
              prompt: 'A PID is:'
              options:
              - A Git tag
              - An identifier the OS assigns to a process
              - A hex color
              - A compiler flag required by CS50
              answer: An identifier the OS assigns to a process
              explanation: You'll see it in ps.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-os-processes-q3
              prompt: 'Scheduling means:'
              options:
              - Deleting RAM
              - The OS choosing which ready process runs on a CPU over time
              - Compiling C
              - Formatting disks nightly
              answer: The OS choosing which ready process runs on a CPU over time
              explanation: Time sharing.
              difficulty: easy
              mastery_requirement: false
            - slug: cf-os-processes-q4
              prompt: 'Starting ls from a shell typically:'
              options:
              - Replaces the kernel
              - Creates a process to run ls, then the shell waits or continues
              - Writes a Git commit
              - Changes the CPU vendor
              answer: Creates a process to run ls, then the shell waits or continues
              explanation: Fork/exec conceptually.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: cf-os-processes-ex1
              title: Inspect processes
              instructions: 'Windows: complete this in WSL (Ubuntu) or a Linux VM. Do not use PowerShell
                or cmd.exe as a substitute for the Unix-shell curriculum. Run `ps -o pid,ppid,cmd` (or
                `ps aux | head`). Identify your shell''s PID and one child command. Write three sentences:
                program vs process vs PID.'
              difficulty: beginner
              order: 0
        - slug: cf-threads
          name: Threads
          description: Threads are multiple execution paths inside one process and share that process's
            memory. CS50 Week 0 mentions threads in Scratch as a light analogy only.
          order: 2
          prerequisites:
          - cf-os-processes
          learning_objective: Contrast threads with processes.
          mastery_criteria:
          - Explain shared memory vs separate processes.
          - State one reason programs use threads.
          - Score >= 80%.
          next_topic: cf-system-calls
          fast_trackable: true
          lessons:
          - slug: cf-threads-core
            title: Threads
            description: Threads are multiple execution paths inside one process and share that process's
              memory. CS50 Week 0 mentions threads in Scratch as a light analogy only.
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: cf-threads-reference
              title: CS50x 2026 Week 0 (Scratch threads mention)
              type: interactive_tutorial
              url: https://cs50.harvard.edu/x/weeks/0/
              provider: CS50x
              role: REFERENCE
              description: Scratch events/threads are a metaphor, not an OS threads course.
              official: true
              order: 0
            questions:
            - slug: cf-threads-q1
              prompt: 'Two threads in one process typically share:'
              options:
              - Nothing, like two VMs
              - The process address space, unlike two processes
              - Two kernels
              - Two physical computers only
              answer: The process address space, unlike two processes
              explanation: Shared memory.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-threads-q2
              prompt: 'A reason to use threads:'
              options:
              - To avoid ever using RAM
              - To overlap waiting (I/O) or use multiple cores inside one program
              - To replace Git
              - To make bits become decimal
              answer: To overlap waiting (I/O) or use multiple cores inside one program
              explanation: Concurrency inside a process.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-threads-q3
              prompt: 'A race condition is more likely when:'
              options:
              - Threads share memory and update it without coordination
              - Two processes never communicate
              - The disk is an SSD
              - You use hexadecimal
              answer: Threads share memory and update it without coordination
              explanation: Preview of later concurrency.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-threads-q4
              prompt: 'Killing a process typically:'
              options:
              - Leaves all its threads running independently forever
              - Ends the threads that belonged to it
              - Formats the SSD
              - Uninstalls the kernel
              answer: Ends the threads that belonged to it
              explanation: Threads live in a process.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-threads-ex1
              title: Process vs thread paragraph
              instructions: 'Write two short paragraphs: (1) when you would use threads vs processes;
                (2) one risk of shared memory. No code required.'
              difficulty: beginner
              order: 0
        - slug: cf-system-calls
          name: System calls
          description: A system call is how a user program asks the kernel to do privileged work such
            as reading a file or creating a process.
          order: 3
          prerequisites:
          - cf-threads
          learning_objective: Explain system calls as the program–kernel interface.
          mastery_criteria:
          - Trace a simple system call conceptually (e.g. write to the terminal).
          - Score >= 80%.
          next_topic: cf-os-memory
          fast_trackable: true
          lessons:
          - slug: cf-system-calls-core
            title: System calls
            description: A system call is how a user program asks the kernel to do privileged work such
              as reading a file or creating a process.
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: cf-system-calls-reference
              title: MIT Missing Semester 2026 — Introduction to the Shell
              type: article
              url: https://missing.csail.mit.edu/2026/course-shell/
