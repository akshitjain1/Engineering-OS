schema_version: 1
kind: curriculum_manifest
origin: official
track:
  slug: engineering-os-v1
  name: Engineering OS
  description: 'Curriculum V1: Computer & Developer Foundations, Java, and Data Structures & Algorithms.'
  order: 0
  levels:
  - slug: domain-0
    name: Domain 0 Foundations
    description: Computer and developer foundations before Java and DSA.
    order: 0
    subjects:
    - slug: computer-developer-foundations
      name: Computer & Developer Foundations
      description: Hardware/OS literacy, terminal, Git, tooling, and problem-solving habits.
      order: 0
      modules:
      - slug: mod-cf-computer-fundamentals
        name: Computer Fundamentals
        order: 0
        topics:
        - slug: cf-bits-and-bytes
          name: Bits and bytes
          description: 'A bit is a binary digit: 0 or 1. A byte is eight bits and can represent 256 distinct
            patterns. Text, images, and instructions are all stored as bits; the meaning comes from the
            encoding we agree on. CS50 Week 0 is the selected source for this representation idea. Do
            not complete the whole CS50 course.'
          order: 0
          prerequisites: []
          learning_objective: Explain how information is measured in bits and bytes.
          mastery_criteria:
          - Explain bits vs bytes without notes.
          - Convert a small quantity between bits and bytes.
          - Score >= 80% on the topic questions.
          next_topic: cf-binary
          fast_trackable: true
          lessons:
          - slug: cf-bits-and-bytes-core
            title: Bits and bytes
            description: 'A bit is a binary digit: 0 or 1. A byte is eight bits and can represent 256
              distinct patterns. Text, images, and instructions are all stored as bits; the meaning comes
              from the encoding we agree on. CS50 Week 0 is the selected source for this representation
              idea. Do not complete the whole CS50 course.'
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: cf-bits-and-bytes-primary
              title: CS50x 2026 Week 0 (representation)
              type: interactive_tutorial
              url: https://cs50.harvard.edu/x/weeks/0/
              provider: CS50x
              role: PRIMARY
              description: Use the unary/binary/decimal and representation sections only. Not the full
                Scratch project.
              official: true
              order: 0
            - slug: cf-bits-and-bytes-reference
              title: CS50x 2026 Lecture 0 notes
              type: documentation
              url: https://cs50.harvard.edu/x/notes/0/
              provider: CS50x
              role: REFERENCE
              description: Notes on bits, bytes, ASCII, and abstraction.
              official: true
              order: 1
            questions:
            - slug: cf-bits-and-bytes-q1
              prompt: Why can one sequence of bits represent a number, a letter, or a color?
              options:
              - Hardware stores a different physical type for each kind of data.
              - The same bit patterns are interpreted using an agreed encoding.
              - Bytes can only represent numbers; letters use a separate chip.
              - Unicode replaces bits with characters at the hardware level.
              answer: The same bit patterns are interpreted using an agreed encoding.
              explanation: Bits are just on/off. ASCII, Unicode, and RGB assign meaning to patterns.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-bits-and-bytes-q2
              prompt: How many distinct values can one byte represent?
              options:
              - '8'
              - '16'
              - '256'
              - '1024'
              answer: '256'
              explanation: Eight bits give 2^8 = 256 patterns (0 through 255).
              difficulty: easy
              mastery_requirement: true
            - slug: cf-bits-and-bytes-q3
              prompt: If a file is 4 KiB, about how many bits is that?
              options:
              - 32 bits
              - 4096 bits
              - 32768 bits
              - 4 million bits
              answer: 32768 bits
              explanation: 4 KiB is 4096 bytes; 4096 × 8 = 32768 bits.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-bits-and-bytes-q4
              prompt: What is the most accurate description of a bit?
              options:
              - A decimal digit from 0–9
              - The smallest unit of digital information, 0 or 1
              - Always equal to one character of text
              - A measure of processor speed
              answer: The smallest unit of digital information, 0 or 1
              explanation: Character encodings use multiple bits per character.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-bits-and-bytes-ex1
              title: Bits vs bytes conversions
              instructions: Convert 3 bytes to bits, 40 bits to bytes (state if it divides evenly), and
                2 KiB to bytes. Write one sentence on why file sizes are usually quoted in bytes or kibibytes
                rather than raw bits.
              difficulty: beginner
              order: 0
        - slug: cf-binary
          name: Binary
          description: Binary is base-2. Each place is a power of two. CS50 Week 0 covers unary, binary,
            and decimal. Practice converting values up to 8 bits by hand so the idea is automatic.
          order: 1
          prerequisites:
          - cf-bits-and-bytes
          learning_objective: Read and convert small binary values.
          mastery_criteria:
          - Explain positional representation in base 2.
          - Convert between binary and decimal for values up to 8 bits without copying.
          - Score >= 80%.
          next_topic: cf-hexadecimal
          fast_trackable: true
          lessons:
          - slug: cf-binary-core
            title: Binary
            description: Binary is base-2. Each place is a power of two. CS50 Week 0 covers unary, binary,
              and decimal. Practice converting values up to 8 bits by hand so the idea is automatic.
            order: 0
            hours_estimated: 0.75
            resources:
            - slug: cf-binary-primary
              title: CS50x 2026 Week 0 (binary/decimal)
              type: interactive_tutorial
              url: https://cs50.harvard.edu/x/weeks/0/
              provider: CS50x
              role: PRIMARY
              description: Unary/binary/decimal sections only.
              official: true
              order: 0
            - slug: cf-binary-reference
              title: CS50x 2026 Lecture 0 notes (binary)
              type: documentation
              url: https://cs50.harvard.edu/x/notes/0/
              provider: CS50x
              role: REFERENCE
              description: Worked binary examples in the official notes.
              official: true
              order: 1
            questions:
            - slug: cf-binary-q1
              prompt: What decimal value is binary 00001101?
              options:
              - '11'
              - '12'
              - '13'
              - '15'
              answer: '13'
              explanation: 8+4+1 = 13.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-binary-q2
              prompt: Why do computers use binary rather than decimal internally?
              options:
              - Decimal arithmetic is illegal in hardware.
              - Two stable physical states (on/off) are reliable to implement.
              - Binary uses fewer digits than decimal for every number.
              - Humans cannot understand decimal.
              answer: Two stable physical states (on/off) are reliable to implement.
              explanation: Electronics distinguish two levels more reliably than ten.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-binary-q3
              prompt: What happens when you add 1 to an 8-bit value that is already 11111111?
              options:
              - It becomes 256 stored in the same 8 bits.
              - It wraps to 00000000 if treated as an 8-bit unsigned value.
              - The CPU refuses to add.
              - It becomes 11111110.
              answer: It wraps to 00000000 if treated as an 8-bit unsigned value.
              explanation: Fixed-width unsigned overflow wraps. CS50 Week 1 later names this integer overflow.
              difficulty: hard
              mastery_requirement: false
            - slug: cf-binary-q4
              prompt: Which place values do you add for binary 1010?
              options:
              - 8+2
              - 8+4
              - 4+2+1
              - 16+2
              answer: 8+2
              explanation: 1010 is 8 + 0 + 2 + 0 = 10.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-binary-ex1
              title: Five conversions
              instructions: 'Convert these binary values to decimal: 00000010, 00010100, 00111111, 10000000,
                11110000. Then convert decimal 19 and 40 to 8-bit binary. Write how you checked one answer
                (powers of two).'
              difficulty: beginner
              order: 0
        - slug: cf-hexadecimal
          name: Hexadecimal
          description: Hexadecimal is base-16. Each hex digit is exactly four bits, so 1111 is F and a
            byte is two hex digits. CS50 Week 0 teaches binary/decimal; hex is the same positional idea
            with grouping. You will see hex in memory dumps, color codes (#RRGGBB), and addresses.
          order: 2
          prerequisites:
          - cf-binary
          learning_objective: Use hexadecimal as a compact view of binary.
          mastery_criteria:
          - Explain why hex is a convenient notation for binary.
          - Convert between binary, hex, and decimal for small values.
          - Score >= 80%.
          next_topic: cf-cpu
          fast_trackable: true
          lessons:
          - slug: cf-hexadecimal-core
            title: Hexadecimal
            description: Hexadecimal is base-16. Each hex digit is exactly four bits, so 1111 is F and
              a byte is two hex digits. CS50 Week 0 teaches binary/decimal; hex is the same positional
              idea with grouping. You will see hex in memory dumps, color codes (#RRGGBB), and addresses.
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: cf-hexadecimal-primary
              title: CS50x 2026 Week 0 (positional representation)
              type: interactive_tutorial
              url: https://cs50.harvard.edu/x/weeks/0/
              provider: CS50x
              role: PRIMARY
              description: Use binary/decimal as the foundation; apply the same positional idea to base-16.
                RGB on this page is hex in disguise.
              official: true
              order: 0
            - slug: cf-hexadecimal-reference
              title: CS50x 2026 Lecture 0 notes (RGB/bytes)
              type: documentation
              url: https://cs50.harvard.edu/x/notes/0/
              provider: CS50x
              role: REFERENCE
              description: RGB uses byte values commonly written in hex in CSS and tools.
              official: true
              order: 1
            questions:
            - slug: cf-hexadecimal-q1
              prompt: Why is one hex digit equal to four bits?
              options:
              - Hex is base 10 and 10 is near 8.
              - 16 = 2^4, so four bits have 16 patterns, one per hex digit.
              - ASCII maps letters A–F to four bits each.
              - CPUs can only add in hex.
              answer: 16 = 2^4, so four bits have 16 patterns, one per hex digit.
              explanation: Nibble = 4 bits = one hex digit.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-hexadecimal-q2
              prompt: What is binary 11110000 in hex?
              options:
              - F0
              - 0F
              - E0
              - FF
              answer: F0
              explanation: 1111 is F and 0000 is 0.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-hexadecimal-q3
              prompt: 'A CSS color #00FF00 uses which idea from CS50 Week 0?'
              options:
              - Threads in Scratch
              - 'RGB: three bytes of color, often written in hex'
              - Pseudocode keywords
              - Floating-point imprecision
              answer: 'RGB: three bytes of color, often written in hex'
              explanation: Week 0 introduces RGB; hex is the usual written form.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-hexadecimal-q4
              prompt: Which conversion is correct?
              options:
              - 0x2A is decimal 32
              - 0x10 is decimal 10
              - 0x10 is decimal 16
              - 0xFF is decimal 128
              answer: 0x10 is decimal 16
              explanation: Hex 10 is 1×16 + 0 = 16.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-hexadecimal-ex1
              title: Nibble grouping
              instructions: Convert binary 11010111 to hex by splitting into two 4-bit groups. Convert
                hex 3C to binary and to decimal. Explain in one sentence why programmers prefer hex over
                long binary strings.
              difficulty: beginner
              order: 0
        - slug: cf-cpu
          name: CPU
          description: 'The CPU (central processing unit) fetches instructions and data, decodes them,
            and executes them. It is not the same as RAM (working memory) or disk (persistent storage).
            CS50 does not teach a full computer-architecture course; this lesson is the internal explanation.
            Week 1 still helps: source becomes machine code that a processor can run.'
          order: 3
          prerequisites:
          - cf-hexadecimal
          learning_objective: Describe what a CPU does in executing programs.
          mastery_criteria:
          - Explain the CPU's role without notes.
          - Contrast CPU with RAM and storage.
          - Score >= 80%.
          next_topic: cf-alu
          fast_trackable: true
          lessons:
          - slug: cf-cpu-core
            title: CPU
            description: 'The CPU (central processing unit) fetches instructions and data, decodes them,
              and executes them. It is not the same as RAM (working memory) or disk (persistent storage).
              CS50 does not teach a full computer-architecture course; this lesson is the internal explanation.
              Week 1 still helps: source becomes machine code that a processor can run.'
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: cf-cpu-reference
              title: CS50x 2026 Week 1 (source to machine code)
              type: interactive_tutorial
              url: https://cs50.harvard.edu/x/weeks/1/
              provider: CS50x
              role: REFERENCE
              description: Use source/machine code/compiler sections to see what the CPU eventually runs.
                Not a CPU microarchitecture lecture.
              official: true
              order: 0
            questions:
            - slug: cf-cpu-q1
              prompt: What is the CPU's job relative to a stored program?
              options:
              - Hold files after you shut the machine down.
              - Fetch, decode, and execute instructions.
              - Replace the need for RAM.
              - Only draw pixels on the screen.
              answer: Fetch, decode, and execute instructions.
              explanation: Persistence is storage; the CPU executes.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-cpu-q2
              prompt: Why isn't a faster disk a substitute for a faster CPU?
              options:
              - Disks already execute instructions.
              - 'They solve different bottlenecks: execution vs long-term storage/transfer.'
              - CPUs cannot wait for I/O.
              - All programs live only on disk while running.
              answer: 'They solve different bottlenecks: execution vs long-term storage/transfer.'
              explanation: Running code needs the processor and RAM, not only disk speed.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-cpu-q3
              prompt: Where do programs sit while the CPU is executing them?
              options:
              - Only in the compiler's source file
              - Typically in RAM, with instructions fed to the CPU
              - Only on GitHub
              - Only in cache forever after install
              answer: Typically in RAM, with instructions fed to the CPU
              explanation: The OS loads a program into memory; the CPU executes from there.
              difficulty: easy
              mastery_requirement: false
            - slug: cf-cpu-q4
              prompt: If two laptops have the same storage size, why might one feel faster?
              options:
              - Storage size is the only performance factor.
              - CPU, RAM, and cache also affect how quickly instructions run.
              - The slower one must be using decimal instead of binary.
              - Faster always means more bytes on disk.
              answer: CPU, RAM, and cache also affect how quickly instructions run.
              explanation: Capacity ≠ compute.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-cpu-ex1
              title: Role comparison
              instructions: Write a 6–10 sentence explanation comparing CPU, registers, RAM, cache, and
                storage. For each, state what problem it solves (speed, capacity, persistence). No extra
                sources required.
              difficulty: beginner
              order: 0
        - slug: cf-alu
          name: ALU
          description: The ALU (arithmetic logic unit) is the part of the CPU that performs integer arithmetic
            and boolean operations (add, subtract, AND, OR, compare). High-level expressions like `x +
            1` and `a && b` become ALU operations after compilation. This topic has no selected CS50 lecture
            that names the ALU; the lesson is the explanation.
          order: 4
          prerequisites:
          - cf-cpu
          learning_objective: Explain the ALU's role in arithmetic and logic.
          mastery_criteria:
          - State what the ALU computes.
          - Relate a simple program statement to ALU work.
          - Score >= 80%.
          next_topic: cf-registers
          fast_trackable: true
          lessons:
          - slug: cf-alu-core
            title: ALU
            description: The ALU (arithmetic logic unit) is the part of the CPU that performs integer
              arithmetic and boolean operations (add, subtract, AND, OR, compare). High-level expressions
              like `x + 1` and `a && b` become ALU operations after compilation. This topic has no selected
              CS50 lecture that names the ALU; the lesson is the explanation.
            order: 0
            hours_estimated: 0.4
            resources: []
            questions:
            - slug: cf-alu-q1
              prompt: Which work belongs to the ALU rather than to a disk controller?
              options:
              - Spinning a hard drive
              - Adding two integers and comparing them
              - Keeping files after shutdown
              - Drawing a window border
              answer: Adding two integers and comparing them
              explanation: ALU = arithmetic and logic on values in the CPU.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-alu-q2
              prompt: A program evaluates `score >= 10`. What is the CPU doing at ALU level?
              options:
              - Storing the source file on disk
              - A comparison that produces a true/false result
              - Opening a network socket
              - Allocating a new hard drive partition
              answer: A comparison that produces a true/false result
              explanation: Comparisons are logic operations.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-alu-q3
              prompt: Why can one ALU serve many kinds of programs?
              options:
              - Every program uses a unique ALU chip.
              - Different programs reduce to a small set of arithmetic/logic operations.
              - The ALU stores the entire operating system.
              - ALUs only run Scratch.
              answer: Different programs reduce to a small set of arithmetic/logic operations.
              explanation: Instruction sets reuse add/compare/etc.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-alu-q4
              prompt: 'Registers vs ALU: which statement is accurate?'
              options:
              - The ALU stores all files; registers add numbers.
              - Registers hold values; the ALU operates on values.
              - They are two names for RAM.
              - The ALU is only used for floating-point graphics.
              answer: Registers hold values; the ALU operates on values.
              explanation: Data vs computation.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-alu-ex1
              title: Statement to operations
              instructions: Take `total = price + tax` and `if total > 100`. List the ALU-level operations
                (add, compare) and which values must be available in registers or RAM first.
              difficulty: beginner
              order: 0
        - slug: cf-registers
          name: Registers
          description: Registers are tiny, extremely fast storage locations inside the CPU. They hold
            the instruction being worked on, addresses, and intermediate results. There are few of them,
            so the CPU constantly moves data between registers and RAM. No CS50 week is a register-file
            course; this is an internal explanation.
          order: 5
          prerequisites:
          - cf-alu
          learning_objective: Explain registers as the CPU's fastest working storage.
          mastery_criteria:
          - Explain why registers are small and fast.
          - Give examples of what is stored in registers during execution.
          - Score >= 80%.
          next_topic: cf-ram
          fast_trackable: true
          lessons:
          - slug: cf-registers-core
            title: Registers
            description: Registers are tiny, extremely fast storage locations inside the CPU. They hold
              the instruction being worked on, addresses, and intermediate results. There are few of them,
              so the CPU constantly moves data between registers and RAM. No CS50 week is a register-file
              course; this is an internal explanation.
            order: 0
            hours_estimated: 0.4
            resources: []
            questions:
            - slug: cf-registers-q1
              prompt: Why are CPU registers much smaller than RAM?
              options:
              - Registers are implemented in slower technology, so they must be tiny.
              - Making huge ultra-fast storage as big as RAM is expensive; a few fast locations is the
                tradeoff.
              - Programs are forbidden from using RAM.
              - Registers only store the operating system kernel.
              answer: Making huge ultra-fast storage as big as RAM is expensive; a few fast locations
                is the tradeoff.
              explanation: 'Memory hierarchy: speed vs size vs cost.'
              difficulty: medium
              mastery_requirement: true
            - slug: cf-registers-q2
              prompt: While adding two numbers, where do the operands typically sit immediately before
                the add?
              options:
              - Only on disk
              - In CPU registers (loaded from RAM if needed)
              - In the Git object database
              - In DNS
              answer: In CPU registers (loaded from RAM if needed)
              explanation: Load into registers, then ALU.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-registers-q3
              prompt: If everything stayed in RAM and never in registers, what would mainly get worse?
              options:
              - File persistence after power off
              - Latency of each arithmetic operation
              - The number of bits in a byte
              - Unicode support
              answer: Latency of each arithmetic operation
              explanation: RAM is slower than registers.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-registers-q4
              prompt: Which is a register, not RAM?
              options:
              - A 16 GB DIMM module
              - A named CPU location holding one word of data during an instruction
              - An SSD partition
              - A USB stick
              answer: A named CPU location holding one word of data during an instruction
              explanation: Registers live on the processor.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-registers-ex1
              title: Trace a tiny add
              instructions: 'On paper, trace `a=3; b=4; c=a+b` as: values in RAM, copies into registers,
                ALU add, write-back. Label each step. This is conceptual, not assembly syntax.'
              difficulty: beginner
              order: 0
        - slug: cf-ram
          name: RAM
          description: 'RAM (main memory) holds the running program''s code and data. It is volatile:
            contents disappear when power is gone. It is larger and slower than registers, smaller and
            faster than disk. A program on disk is not executing until loaded.'
          order: 6
          prerequisites:
          - cf-registers
          learning_objective: Explain RAM as volatile working memory.
          mastery_criteria:
          - Contrast RAM with registers and with disk.
          - Explain volatility.
          - Score >= 80%.
          next_topic: cf-cache
          fast_trackable: true
          lessons:
          - slug: cf-ram-core
            title: RAM
            description: 'RAM (main memory) holds the running program''s code and data. It is volatile:
              contents disappear when power is gone. It is larger and slower than registers, smaller and
              faster than disk. A program on disk is not executing until loaded.'
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: cf-ram-reference
              title: CS50x 2026 Week 1 (programs as compiled machine code)
              type: interactive_tutorial
              url: https://cs50.harvard.edu/x/weeks/1/
              provider: CS50x
              role: REFERENCE
              description: Compiled programs are loaded into memory to run. Not a DRAM-engineering lecture.
              official: true
              order: 0
            questions:
            - slug: cf-ram-q1
              prompt: What does volatile mean for RAM?
              options:
              - It can catch fire easily.
              - Data is lost when power is removed.
              - It can only store videos.
              - It is slower than magnetic tape.
              answer: Data is lost when power is removed.
              explanation: Unlike disk/SSD persistence.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-ram-q2
              prompt: Why must a program be loaded into RAM to run?
              options:
              - The CPU executes from working memory, not by scanning the whole disk for each instruction.
              - Disk cannot store machine code.
              - RAM is the only place compilers exist.
              - Git requires RAM to store remotes.
              answer: The CPU executes from working memory, not by scanning the whole disk for each instruction.
              explanation: Load then execute.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-ram-q3
              prompt: You open a 2 GB file on a machine with 1 GB free RAM. What is a likely consequence?
              options:
              - The file becomes 1 GB on disk.
              - The OS may use virtual memory/swapping and the machine can slow down.
              - Registers expand to 2 GB.
              - Hexadecimal conversion fails.
              answer: The OS may use virtual memory/swapping and the machine can slow down.
              explanation: Preview of virtual memory; do not need kernel internals yet.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-ram-q4
              prompt: Which comparison is correct?
              options:
              - RAM is typically faster than registers.
              - RAM is typically faster than disk and slower than registers.
              - RAM persists like an SSD.
              - RAM and ALU are the same component.
              answer: RAM is typically faster than disk and slower than registers.
              explanation: Hierarchy.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-ram-ex1
              title: Volatility check
              instructions: 'Write three bullets: (1) what happens to unsaved editor buffers if power
                dies, (2) what happens to a saved file on disk, (3) why that difference exists (RAM vs
                storage).'
              difficulty: beginner
              order: 0
        - slug: cf-cache
          name: Cache
          description: A cache is a small fast memory that stores recently used data and instructions
            so the CPU does not wait on RAM every time. It works because programs reuse nearby data (locality).
            You do not need cache-coherence protocols at this level.
          order: 7
          prerequisites:
          - cf-ram
          learning_objective: Explain why caches exist between CPU and RAM.
          mastery_criteria:
          - Explain locality at a high level.
          - Place cache in the memory hierarchy.
          - Score >= 80%.
          next_topic: cf-storage
          fast_trackable: true
          lessons:
          - slug: cf-cache-core
            title: Cache
            description: A cache is a small fast memory that stores recently used data and instructions
              so the CPU does not wait on RAM every time. It works because programs reuse nearby data
              (locality). You do not need cache-coherence protocols at this level.
            order: 0
            hours_estimated: 0.5
            resources: []
            questions:
            - slug: cf-cache-q1
              prompt: What problem does cache exist to solve?
              options:
              - Making disks bigger
              - Hiding RAM latency for the common case of reused data
              - Replacing the ALU
              - Encrypting every byte
              answer: Hiding RAM latency for the common case of reused data
              explanation: Cache sits between CPU and RAM for speed.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-cache-q2
              prompt: Why does looping over an array often hit cache well?
              options:
              - Arrays are stored on GitHub.
              - Consecutive elements are nearby in memory (spatial locality).
              - The ALU turns into RAM.
              - Cache only works for strings.
              answer: Consecutive elements are nearby in memory (spatial locality).
              explanation: Locality.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-cache-q3
              prompt: If cache is so fast, why not make all memory cache?
              options:
              - It would violate Unicode.
              - That much ultra-fast memory is costly; hierarchy is the engineering compromise.
              - Operating systems forbid it.
              - Cache cannot store zeros.
              answer: That much ultra-fast memory is costly; hierarchy is the engineering compromise.
              explanation: Same tradeoff as registers vs RAM.
              difficulty: easy
              mastery_requirement: false
            - slug: cf-cache-q4
              prompt: 'A cache miss means:'
              options:
              - The program has a syntax error.
              - The needed data was not in cache and must come from a slower level (e.g. RAM).
              - The disk is full.
              - Hex conversion failed.
              answer: The needed data was not in cache and must come from a slower level (e.g. RAM).
              explanation: Miss = go slower.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-cache-ex1
              title: Hierarchy diagram
              instructions: Draw (boxes) registers → cache → RAM → storage. Annotate each with relative
                speed, size, and persistence. Add one sentence on why looping an array is cache-friendly.
              difficulty: beginner
              order: 0
        - slug: cf-storage
          name: Storage
          description: Storage (SSD/HDD) keeps data when power is off. It is slower than RAM. Files, installed
            programs, and Git repos live here. The OS copies needed pieces into RAM to run them.
          order: 8
          prerequisites:
          - cf-cache
          learning_objective: Contrast persistent storage with RAM.
          mastery_criteria:
          - Explain persistence vs volatility.
          - Give typical uses of disk/SSD vs RAM.
          - Score >= 80%.
          next_topic: cf-instruction-execution
          fast_trackable: true
          lessons:
          - slug: cf-storage-core
            title: Storage
            description: Storage (SSD/HDD) keeps data when power is off. It is slower than RAM. Files,
              installed programs, and Git repos live here. The OS copies needed pieces into RAM to run
              them.
            order: 0
            hours_estimated: 0.4
            resources: []
            questions:
            - slug: cf-storage-q1
              prompt: What is the defining property of persistent storage vs RAM?
              options:
              - Storage is always faster than RAM.
              - Storage retains data without power; RAM does not.
              - Storage is inside the ALU.
              - Storage can only hold pictures.
              answer: Storage retains data without power; RAM does not.
              explanation: Persistence.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-storage-q2
              prompt: Why don't we execute every instruction directly off the SSD?
              options:
              - SSDs cannot store bytes.
              - Random instruction fetch from storage is far slower than from RAM.
              - Compilers refuse to write to SSD.
              - SSDs only understand hexadecimal.
              answer: Random instruction fetch from storage is far slower than from RAM.
              explanation: Load into RAM first.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-storage-q3
              prompt: A Git repository's `.git` directory lives primarily where when you are not running
                Git?
              options:
              - Only in CPU registers
              - On persistent storage in the project folder
              - Only in L1 cache
              - Only in the compiler
              answer: On persistent storage in the project folder
              explanation: Later Git topics; conceptually it is files on disk.
              difficulty: easy
              mastery_requirement: false
            - slug: cf-storage-q4
              prompt: 'Saving a file in an editor typically means:'
              options:
              - Copying RAM buffers to persistent storage
              - Deleting RAM
              - Changing the ALU model
              - Creating a CPU core
              answer: Copying RAM buffers to persistent storage
              explanation: Save = persist.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-storage-ex1
              title: Save vs run
              instructions: Describe the path of a `.c` or `.py` file from disk → editor (RAM) → save
                (disk) → run (load into RAM, CPU executes). Five to eight sentences.
              difficulty: beginner
              order: 0
        - slug: cf-instruction-execution
          name: Instruction execution
          description: 'The processor repeats: fetch the next instruction from memory, decode what it
            means, execute it (often with the ALU), then continue. A simple assignment becomes several
            instructions. CS50 Week 1 shows source becoming machine code; it does not walk microarchitecture
            pipelines.'
          order: 9
          prerequisites:
          - cf-storage
          learning_objective: Describe fetch-decode-execute at a conceptual level.
          mastery_criteria:
          - Walk through fetch-decode-execute without notes.
          - Relate a simple statement to an instruction stream.
          - Score >= 80%.
          next_topic: cf-machine-code
          fast_trackable: true
          lessons:
          - slug: cf-instruction-execution-core
            title: Instruction execution
            description: 'The processor repeats: fetch the next instruction from memory, decode what it
              means, execute it (often with the ALU), then continue. A simple assignment becomes several
              instructions. CS50 Week 1 shows source becoming machine code; it does not walk microarchitecture
              pipelines.'
            order: 0
            hours_estimated: 0.5
            resources:
