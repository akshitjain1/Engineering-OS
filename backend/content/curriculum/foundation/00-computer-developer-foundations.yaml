              order: 0
            questions:
            - slug: cf-dry-runs-q1
              prompt: 'A dry run is:'
              options:
              - Deleting tests
              - Executing the steps on paper with a tiny input
              - Pushing to origin
              - Formatting /
              answer: Executing the steps on paper with a tiny input
              explanation: Trace.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-dry-runs-q2
              prompt: 'Dry runs catch:'
              options:
              - Only CSS bugs
              - Off-by-one and wrong updates before you automate
              - Only network outages
              - Only Git conflicts
              answer: Off-by-one and wrong updates before you automate
              explanation: Cheap bugs.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-dry-runs-q3
              prompt: 'If the dry run disagrees with the code:'
