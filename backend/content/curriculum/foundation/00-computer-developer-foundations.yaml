              - The paper is always wrong
              - At least one of them is wrong; investigate
              - Reboot
              - chmod +x everything
              answer: At least one of them is wrong; investigate
              explanation: Don't trust blindly.
              difficulty: easy
              mastery_requirement: false
            - slug: cf-dry-runs-q4
              prompt: 'A 4-element array is a good dry-run size because:'
