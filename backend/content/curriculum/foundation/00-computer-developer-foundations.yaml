              answer: Code does what you told it to do
              explanation: Lecture intro.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-debugging-thinking-q2
              prompt: 'A hypothesis in debugging is:'
              options:
              - A random rewrite of the whole file
              - A testable guess about why the observed behavior happens
              - A Git rebase
              - A formatter
              answer: A testable guess about why the observed behavior happens
              explanation: Scientific loop.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-debugging-thinking-q3
              prompt: 'Changing three things at once is bad because:'
              options:
              - Git forbids it
              - You cannot tell which change mattered
              - WSL crashes
              - man pages disappear
              answer: You cannot tell which change mattered
              explanation: Isolate.
              difficulty: easy
              mastery_requirement: false
            - slug: cf-debugging-thinking-q4
              prompt: 'If a test fails, first you should:'
              options:
