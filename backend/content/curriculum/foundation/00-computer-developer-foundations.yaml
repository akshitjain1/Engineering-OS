              - The entire SSD
              - Only environment variables
              answer: The next instruction (and as needed its data) from memory
              explanation: Fetch from memory into the CPU.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-instruction-execution-q2
              prompt: 'Decode means:'
              options:
              - Delete the source file
              - Interpret the bit pattern as an operation and operands
              - Format the disk
              - Open a pull request
              answer: Interpret the bit pattern as an operation and operands
              explanation: Instruction encoding.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-instruction-execution-q3
              prompt: Why is `x = x + 1` more than one hardware step?
              options:
              - High-level statements compile to multiple instructions (load, add, store).
              - The ALU cannot add 1.
              - RAM forbids plus.
              - Hexadecimal cannot represent x.
              answer: High-level statements compile to multiple instructions (load, add, store).
              explanation: One line ≠ one cycle necessarily.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-instruction-execution-q4
              prompt: What happens after execute in the simple model?
              options:
              - The computer always shuts down.
              - The CPU continues with the next instruction (unless a jump/branch).
              - Git auto-commits.
              - All cache is erased by law.
              answer: The CPU continues with the next instruction (unless a jump/branch).
              explanation: Sequential execution plus branches.
              difficulty: easy
              mastery_requirement: false
            exercises:
