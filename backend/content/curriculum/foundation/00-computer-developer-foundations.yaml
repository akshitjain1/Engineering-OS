              instructions: 'Conceptually trace `echo hi`: shell, bytes, kernel write to the terminal.
                Five to eight sentences. Optional: `Windows: complete this in WSL (Ubuntu) or a Linux
                VM. Do not use PowerShell or cmd.exe as a substitute for the Unix-shell curriculum.` `strace
                -e write echo hi`.'
              difficulty: beginner
              order: 0
        - slug: cf-os-memory
          name: Memory
          description: Each process has an address space. The OS allocates pages and protects regions.
          order: 4
          prerequisites:
          - cf-system-calls
          learning_objective: Explain that the OS manages process memory.
          mastery_criteria:
          - Explain that process memory is an OS-managed address space.
          - Score >= 80%.
          next_topic: cf-virtual-memory-basics
          fast_trackable: true
          lessons:
          - slug: cf-os-memory-core
            title: Memory
            description: Each process has an address space. The OS allocates pages and protects regions.
            order: 0
            hours_estimated: 0.45
            resources: []
            questions:
            - slug: cf-os-memory-q1
              prompt: 'A process address space is:'
              options:
              - The SSD model number
              - The range of virtual addresses the process may use, mapped by the OS
              - The Git remote URL
              - The compiler version
              answer: The range of virtual addresses the process may use, mapped by the OS
              explanation: Leads into virtual memory.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-os-memory-q2
              prompt: 'If a process reads memory it does not own:'
              options:
              - The ALU melts
              - The OS typically kills it (segmentation fault) rather than allowing corruption of others
              - Git auto-fixes it
              - Hex becomes decimal
              answer: The OS typically kills it (segmentation fault) rather than allowing corruption of
                others
              explanation: Protection.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-os-memory-q3
              prompt: 'Stack vs heap at programmer level:'
              options:
              - Both are disk partitions
              - Stack holds call frames/locals; heap is for dynamic allocation
              - Heap is only for Git objects
              - Stack is only for SSDs
              answer: Stack holds call frames/locals; heap is for dynamic allocation
              explanation: Enough for Domain 0.
              difficulty: easy
              mastery_requirement: false
            - slug: cf-os-memory-q4
              prompt: Who decides which physical RAM page backs an address?
              options:
              - The CSS engine
              - The OS (with hardware MMU help)
              - The user typing hex
              - GitHub Hello World
              answer: The OS (with hardware MMU help)
              explanation: Virtual memory next.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-os-memory-ex1
              title: Address space sketch
              instructions: 'Sketch a process: code, stack, heap. Label which grows with function calls
                vs dynamic allocation. One figure plus four sentences.'
              difficulty: beginner
              order: 0
        - slug: cf-virtual-memory-basics
          name: Virtual memory basics
          description: Virtual memory lets each process see its own address space. The OS maps virtual
            pages to physical frames or swap.
          order: 5
          prerequisites:
          - cf-os-memory
          learning_objective: Explain virtual vs physical addresses at a high level.
          mastery_criteria:
          - Explain virtual vs physical addresses in one paragraph.
          - Score >= 80%.
          next_topic: cf-filesystems
          fast_trackable: true
          lessons:
          - slug: cf-virtual-memory-basics-core
            title: Virtual memory basics
            description: Virtual memory lets each process see its own address space. The OS maps virtual
              pages to physical frames or swap.
            order: 0
            hours_estimated: 0.6
            resources: []
            questions:
            - slug: cf-virtual-memory-basics-q1
              prompt: 'Virtual address means:'
              options:
              - An address that does not exist
              - An address in the process's view, translated to physical memory by OS/hardware
              - Only IPv6
              - A Git SHA
              answer: An address in the process's view, translated to physical memory by OS/hardware
              explanation: Translation.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-virtual-memory-basics-q2
              prompt: 'A benefit of per-process virtual spaces:'
              options:
              - Processes can reuse similar pointer values without colliding in physical RAM
              - Disks become registers
              - Compilers become kernels
              - Bits become analog
              answer: Processes can reuse similar pointer values without colliding in physical RAM
              explanation: Isolation plus convenience.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-virtual-memory-basics-q3
              prompt: 'Swap/paging when RAM is tight:'
              options:
              - Deletes the kernel
              - Moves idle pages to disk, which can slow the machine
              - Converts programs to hex
              - Disables the ALU
              answer: Moves idle pages to disk, which can slow the machine
              explanation: Capacity vs speed.
              difficulty: easy
              mastery_requirement: false
            - slug: cf-virtual-memory-basics-q4
              prompt: 'Physical address is:'
              options:
              - The location in actual RAM (or device memory)
              - Always equal to the Git blob id
              - Only used by CSS
              - A type of syscall name
              answer: The location in actual RAM (or device memory)
              explanation: Hardware address.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-virtual-memory-basics-ex1
              title: Why the same number can be reused
              instructions: Explain in a paragraph why two processes can both have a pointer that looks
                like the same number without sharing the same physical bytes.
              difficulty: beginner
              order: 0
