              - SSD brand
              answer: How work grows as input size grows
              explanation: Growth rate.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-time-complexity-intro-q2
              prompt: 'Nested loops over n typically:'
              options:
              - O(1)
              - O(n^2) in the simple case
              - O(log n) always
              - O(PATH)
              answer: O(n^2) in the simple case
              explanation: Intro only.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-time-complexity-intro-q3
              prompt: 'A faster CPU:'
              options:
              - Changes O(n^2) into O(n) by magic
