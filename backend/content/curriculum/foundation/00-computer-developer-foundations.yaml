              order: 0
            questions:
            - slug: cf-system-calls-q1
              prompt: 'A system call crosses from:'
              options:
              - RAM to SSD only
              - User program into the kernel to request a service
              - Git to GitHub only
              - Hex to decimal
              answer: User program into the kernel to request a service
              explanation: The API of the OS.
              difficulty: easy
              mastery_requirement: true
            - slug: cf-system-calls-q2
              prompt: Why is opening a file typically a syscall (or wraps one)?
              options:
              - Files live in the ALU
              - Accessing the filesystem/devices is privileged and centralized in the kernel
              - Compilers cannot name files
              - Git requires it for hex
              answer: Accessing the filesystem/devices is privileged and centralized in the kernel
              explanation: Protection.
              difficulty: medium
              mastery_requirement: true
            - slug: cf-system-calls-q3
              prompt: 'echo hello showing text involves:'
              options:
              - No kernel, only the CPU cache
              - The process eventually asking the kernel to write bytes to the terminal
              - A Git merge
              - RGB conversion
              answer: The process eventually asking the kernel to write bytes to the terminal
              explanation: write/syscall conceptually.
              difficulty: medium
              mastery_requirement: false
            - slug: cf-system-calls-q4
              prompt: 'User code that only adds two numbers in registers:'
              options:
              - Must always syscall
              - Can run in user mode without a syscall
              - Always formats the disk
              - Always creates a thread
              answer: Can run in user mode without a syscall
              explanation: Not every instruction is a syscall.
              difficulty: easy
              mastery_requirement: false
            exercises:
            - slug: cf-system-calls-ex1
