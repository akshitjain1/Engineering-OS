              provider: Dev.java
              role: REFERENCE
              description: Authoritative polymorphism tutorial.
              official: true
              order: 1
            - slug: java-polymorphism-deep
              title: Pattern matching
              type: documentation
              url: https://dev.java/learn/pattern-matching/
              provider: Dev.java
              role: DEEP_DIVE
              description: Modern instanceof/pattern matching. Optional; not a DSA prerequisite.
              official: true
              order: 2
            questions:
            - slug: java-polymorphism-q1
              prompt: 'Animal a = new Dog(); a.speak(); if Dog overrides speak:'
              options:
              - Animal.speak always runs.
              - Dog.speak runs (dynamic dispatch).
              - Does not compile.
              - Both run.
              answer: Dog.speak runs (dynamic dispatch).
              explanation: Runtime type is Dog.
              difficulty: medium
              mastery_requirement: true
            - slug: java-polymorphism-q2
              prompt: 'a.wag() when wag exists only on Dog:'
              options:
              - Compiles because runtime is Dog.
              - Does not compile; compile-time type Animal has no wag.
              - Throws always.
              - Is a static method.
              answer: Does not compile; compile-time type Animal has no wag.
              explanation: Cast or give Animal a method. Prefer a method on the type you hold.
              difficulty: medium
              mastery_requirement: false
            - slug: java-polymorphism-q3
              prompt: 'Overloading vs overriding:'
              options:
              - They are the same.
              - Overloading is compile-time by signature; overriding is runtime by class.
              - Overriding is compile-time only.
              - Overloading requires inheritance.
              answer: Overloading is compile-time by signature; overriding is runtime by class.
              explanation: Do not mix the words in interviews.
              difficulty: medium
              mastery_requirement: false
            - slug: java-polymorphism-q4
              prompt: 'A chain of instanceof checks instead of overrides is often:'
              options:
              - The most extensible design.
              - A sign you should put the behavior on the type (or a visitor) instead of switching on
                class.
              - Required by the JVM.
              - Faster than dispatch always.
              answer: A sign you should put the behavior on the type (or a visitor) instead of switching
                on class.
              explanation: Pattern matching makes instanceof nicer; it does not fix a type-switch design
                by itself.
              difficulty: medium
              mastery_requirement: false
            - slug: java-polymorphism-q5
              prompt: 'List<Animal> can hold Dog and Cat because:'
              options:
              - Generics erase Animal.
              - Dog and Cat are Animals; the list's static type is Animal.
              - Lists ignore types.
              - It is illegal.
              answer: Dog and Cat are Animals; the list's static type is Animal.
              explanation: Getting an element yields Animal statically.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-polymorphism-ex1
              title: Runtime behavior
              instructions: Shape with area(); Circle and Rectangle override it. Put mixed shapes in a
                Shape[] and print areas in one loop with no instanceof. Then write a bad version that
                instanceof-switches and comment why the override version is the point of this topic.
              difficulty: intermediate
              order: 0
