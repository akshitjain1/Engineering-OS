            questions:
            - slug: java-inheritance-q1
              prompt: 'super(name) in a subclass constructor:'
              options:
              - Is optional if the superclass has only a parameterized constructor.
              - Calls the superclass constructor; required when there is no no-arg super constructor.
              - Overrides a method.
              - Creates a copy of the subclass.
              answer: Calls the superclass constructor; required when there is no no-arg super constructor.
              explanation: Java inserts super() only when a no-arg super constructor exists.
              difficulty: medium
              mastery_requirement: true
            - slug: java-inheritance-q2
              prompt: 'A limitation of inheritance:'
              options:
              - You cannot reuse any code.
              - You get a tightly coupled hierarchy; reused code in the wrong parent infects all children.
              - Overriding is illegal.
              - super is deprecated.
              answer: You get a tightly coupled hierarchy; reused code in the wrong parent infects all
                children.
              explanation: Composition plugs in a helper object instead.
              difficulty: medium
              mastery_requirement: false
            - slug: java-inheritance-q3
              prompt: 'Stack extends ArrayList is a famous smell because:'
              options:
              - ArrayList is final.
              - Stack is-not-really-a List; clients can use ArrayList methods that break stack discipline.
              - Java forbids extending collections.
              - Stacks must be arrays.
              answer: Stack is-not-really-a List; clients can use ArrayList methods that break stack discipline.
              explanation: Has-a List (composition) keeps the API small.
              difficulty: medium
              mastery_requirement: false
            - slug: java-inheritance-q4
              prompt: '@Override is useful because:'
              options:
              - It makes methods static.
              - The compiler checks you actually overrode a superclass method (typos become errors).
              - It is required for private methods.
              - It disables polymorphism.
              answer: The compiler checks you actually overrode a superclass method (typos become errors).
              explanation: Use it.
              difficulty: medium
              mastery_requirement: false
            - slug: java-inheritance-q5
              prompt: 'protected vs private:'
              options:
              - protected members are visible to subclasses (and the package); private are not.
              - private is visible to subclasses.
              - protected means public.
              - They are identical.
              answer: protected members are visible to subclasses (and the package); private are not.
              explanation: Prefer private until a subclass genuinely needs it.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-inheritance-ex1
              title: Hierarchy, then composition question
              instructions: 'Create Vehicle { id } and Car extends Vehicle { int doors } with an overridden
                description(). Then write a 6–8 sentence answer: for a ParkingLot that stores vehicles,
                is inheritance the right tool, or would ParkingLot compose a List<Vehicle>? Could Car
                instead compose an Engine? Pick one place where composition is better and say why.'
              difficulty: intermediate
              order: 0
        - slug: java-polymorphism
          name: Polymorphism
          description: The compile-time type of a variable decides which members you can name. The runtime
            class of the object decides which override runs (dynamic dispatch). Interface types work the
            same way. instanceof (and pattern matching) tests runtime type — use sparingly vs real polymorphism.
            Not a DSA gate, but it shows up in Java design.
          order: 5
          prerequisites:
          - java-inheritance
          learning_objective: Call overridden methods through a supertype and explain compile-time types
            vs runtime dispatch.
          mastery_criteria:
          - Write code whose behavior changes with runtime type.
          - Explain static type vs dynamic dispatch.
          - Score >= 80% on the topic questions.
          next_topic: java-abstract-classes
          fast_trackable: true
          lessons:
