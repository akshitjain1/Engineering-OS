              mastery_requirement: false
            - slug: java-checked-unchecked-q5
              prompt: 'Layered propagation means:'
              options:
              - UI catches, logs, shows a message; domain throws; low-level I/O throws IOException.
              - Every layer must catch and ignore.
              - Only main can throw.
              - Checked exceptions cannot cross packages.
