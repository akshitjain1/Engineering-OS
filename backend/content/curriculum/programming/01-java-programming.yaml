                control practice.
              official: true
              order: 1
            questions:
            - slug: java-break-continue-q1
              prompt: 'In `for (int x : nums) { if (x < 0) continue; sum += x; }` continue does what?'
              options:
              - Exits the method.
              - Skips negatives, still processes later elements.
              - Deletes x from the array.
              - Restarts the JVM.
              answer: Skips negatives, still processes later elements.
              explanation: Equivalent to wrapping the add in `if (x >= 0)`.
              difficulty: medium
              mastery_requirement: true
            - slug: java-break-continue-q2
              prompt: 'break inside a nested loop (unlabeled) exits:'
              options:
              - All loops in the method.
              - Only the innermost loop.
              - The program.
              - The outer loop only.
              answer: Only the innermost loop.
              explanation: Labeled break can exit outer loops; prefer extracting a method.
              difficulty: medium
              mastery_requirement: false
            - slug: java-break-continue-q3
              prompt: 'A loop that is mostly continue-guards may be clearer as:'
              options:
              - More labels.
              - if-conditions that only run the real work on interesting cases.
              - A switch on Thread.
              - catching Error.
              answer: if-conditions that only run the real work on interesting cases.
              explanation: continue is fine; it is not a badge of cleverness.
              difficulty: medium
              mastery_requirement: false
            - slug: java-break-continue-q4
              prompt: 'break in switch vs loop:'
              options:
