schema_version: 1
kind: curriculum_manifest
origin: official
track:
  slug: engineering-os-v1
  name: Engineering OS
  description: 'Curriculum V1: Computer & Developer Foundations, Java, and Data Structures & Algorithms.'
  order: 0
  levels:
  - slug: domain-1
    name: Domain 1 Java
    description: Java programming. Helsinki I/II for exercises; Dev.java for modern reference. Parallel
      with DSA after fundamentals.
    order: 1
    subjects:
    - slug: java-programming
      name: Java Programming
      description: A structured Java sequence. Streams, concurrency, and JVM are not DSA gates. Records/modules/virtual
        threads are later/reference.
      order: 0
      modules:
      - slug: mod-java-getting-started
        name: Getting Started
        order: 0
        topics:
        - slug: java-jdk-jre
          name: JDK and JRE
          description: The JDK (Java Development Kit) is what you install to compile and run Java. The
            JVM (Java Virtual Machine) executes bytecode. A JRE was historically a runtime-only subset;
            modern OpenJDK/Oracle distributions emphasize the JDK. You write .java source, javac (or the
            Java launcher) produces .class bytecode, and the JVM runs it. Helsinki's setup still mentions
            older NetBeans/TMC tooling — that is not required. Verify `java -version` and `javac -version`
            on your machine. IDE choice is optional (VS Code is fine).
          order: 0
          prerequisites:
          - cf-space-complexity-intro
          - cf-dependency-management
          learning_objective: Install a current JDK and explain JDK vs JRE vs JVM.
          mastery_criteria:
          - Explain JDK vs JVM vs historical JRE without notes.
          - Install or locate a JDK and print java/javac versions.
          - Score >= 80% on the topic questions.
          next_topic: java-first-program
          fast_trackable: true
          lessons:
          - slug: java-jdk-jre-core
            title: JDK and JRE
            description: The JDK (Java Development Kit) is what you install to compile and run Java. The
              JVM (Java Virtual Machine) executes bytecode. A JRE was historically a runtime-only subset;
              modern OpenJDK/Oracle distributions emphasize the JDK. You write .java source, javac (or
              the Java launcher) produces .class bytecode, and the JVM runs it. Helsinki's setup still
              mentions older NetBeans/TMC tooling — that is not required. Verify `java -version` and `javac
              -version` on your machine. IDE choice is optional (VS Code is fine).
            order: 0
            hours_estimated: 0.75
            resources:
            - slug: java-jdk-jre-primary
              title: Getting Started with Java (JDK setup)
              type: documentation
              url: https://dev.java/learn/getting-started/
              provider: Dev.java
              role: PRIMARY
              description: Modern JDK download/setup, compilation cycle, and first program. Authoritative
                for tooling.
              official: true
              order: 0
            - slug: java-jdk-jre-reference
              title: javac — Core JDK tools
              type: documentation
              url: https://dev.java/learn/jvm/tools/core/javac/
              provider: Dev.java
              role: REFERENCE
              description: Official javac tool page.
              official: true
              order: 1
            - slug: java-jdk-jre-practice
              title: Helsinki Part 1 — Getting started
              type: interactive_tutorial
              url: https://java-programming.mooc.fi/part-1/1-starting-programming/
              provider: University of Helsinki
              role: PRACTICE
              description: University of Helsinki Java Programming I/II is the exercise-heavy layer. It
                is a legacy, unmaintained course (historically JDK 11 and NetBeans/TMC). Do not treat
                that toolchain as required. Complete the same exercises with a current JDK using javac/java,
                JShell, or an IDE of your choice. Dev.java is the authoritative modern reference. Use
                the programming-environment exercises; ignore NetBeans as a mandate.
              official: true
              order: 2
            questions:
            - slug: java-jdk-jre-q1
              prompt: Why does a Java developer typically install a JDK rather than a historical JRE?
              options:
              - A JRE can compile .java files but cannot run them.
              - A JDK includes the compiler and other development tools; a JRE was runtime-only.
              - The JVM only exists inside a JRE, never inside a JDK.
              - A JDK is required only for Android, not for console Java.
              answer: A JDK includes the compiler and other development tools; a JRE was runtime-only.
              explanation: You need javac (or equivalent) to build. Runtime-only bundles were for running
                already-built apps.
              difficulty: medium
              mastery_requirement: true
            - slug: java-jdk-jre-q2
              prompt: What does the JVM actually execute?
              options:
              - C++ object files produced by javac.
              - Raw .java text, interpreted line by line like a shell script.
              - Bytecode, typically stored in .class files.
              - SQL stored procedures generated from annotations.
              answer: Bytecode, typically stored in .class files.
              explanation: javac translates source to bytecode; the JVM loads and executes that bytecode.
              difficulty: medium
              mastery_requirement: false
            - slug: java-jdk-jre-q3
              prompt: You run `java -version` successfully but `javac -version` is not found. What is
                the most likely situation?
              options:
              - The JVM is missing but the compiler is installed.
              - A runtime is on PATH, but the compiler from a JDK is not.
              - Your source file has a syntax error.
              - You must install Maven before javac exists.
              answer: A runtime is on PATH, but the compiler from a JDK is not.
              explanation: java can exist without javac if only a runtime is installed or PATH points
                at the wrong bin.
              difficulty: medium
              mastery_requirement: false
            - slug: java-jdk-jre-q4
              prompt: Is a specific IDE required to learn this Java curriculum?
              options:
              - 'Yes: only NetBeans with TMC is valid.'
              - 'Yes: only IntelliJ Ultimate is valid.'
              - 'No: javac/java, JShell, or any IDE that uses a JDK is acceptable.'
              - 'Yes: VS Code is mandatory because the user uses it.'
              answer: 'No: javac/java, JShell, or any IDE that uses a JDK is acceptable.'
              explanation: VS Code is convenient here but not a conceptual requirement. Helsinki's NetBeans
                path is legacy.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-jdk-jre-ex1
              title: Verify the JDK
              instructions: 'Install or locate a current JDK. From a terminal, run `java -version` and
                `javac -version` and save the output. Write three sentences: what the JDK is, what the
                JVM is, and why a historical JRE would be insufficient for compiling. If you use an IDE
                (optional), point it at the same JDK. Do not treat NetBeans as required.'
              difficulty: beginner
              order: 0
        - slug: java-first-program
          name: First program
          description: A first Java application is a class with `public static void main(String[] args)`.
            The file name should match the public class. Printing uses System.out. Starting with recent
            JDKs you can also launch a `.java` source file directly; still learn the class/main shape
            because DSA and interviews expect it. Do not complete Helsinki as a beginner-from-zero course
            — use the first print exercises as reps.
          order: 1
          prerequisites:
          - java-jdk-jre
          learning_objective: Write, compile, and run a single-class Java program with a main method.
          mastery_criteria:
          - Write a Hello World class independently.
          - Explain what main is for.
          - Score >= 80% on the topic questions.
          next_topic: java-compile-and-run
          fast_trackable: true
          lessons:
          - slug: java-first-program-core
            title: First program
            description: A first Java application is a class with `public static void main(String[] args)`.
              The file name should match the public class. Printing uses System.out. Starting with recent
              JDKs you can also launch a `.java` source file directly; still learn the class/main shape
              because DSA and interviews expect it. Do not complete Helsinki as a beginner-from-zero course
              — use the first print exercises as reps.
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: java-first-program-primary
              title: Helsinki Part 1 — Printing
              type: interactive_tutorial
              url: https://java-programming.mooc.fi/part-1/2-printing/
              provider: University of Helsinki
              role: PRIMARY
              description: University of Helsinki Java Programming I/II is the exercise-heavy layer. It
                is a legacy, unmaintained course (historically JDK 11 and NetBeans/TMC). Do not treat
                that toolchain as required. Complete the same exercises with a current JDK using javac/java,
                JShell, or an IDE of your choice. Dev.java is the authoritative modern reference. Printing
                and first programs.
              official: true
              order: 0
            - slug: java-first-program-reference
              title: Getting Started with Java
              type: documentation
              url: https://dev.java/learn/getting-started/
              provider: Dev.java
              role: REFERENCE
              description: Modern first-class / first-application walkthrough.
              official: true
              order: 1
            - slug: java-first-program-practice
              title: JShell — The Java Shell Tool
              type: documentation
              url: https://dev.java/learn/jshell-tool/
              provider: Dev.java
              role: PRACTICE
              description: Use JShell to evaluate small expressions without a full class when exploring
                syntax.
              official: true
              order: 2
            questions:
            - slug: java-first-program-q1
              prompt: Why does a typical Java application declare `public static void main(String[] args)`?
              options:
              - The JVM looks for this method as the program entry point.
              - main is required on every class, including helper classes.
              - args must be named args or the program will not compile.
              - void means the method prints automatically.
              answer: The JVM looks for this method as the program entry point.
              explanation: static lets the JVM call it without constructing an object first.
              difficulty: medium
              mastery_requirement: true
            - slug: java-first-program-q2
              prompt: A public class is named Greeter. What should the source file usually be called?
              options:
              - greeter.java
              - Main.java
              - Greeter.java
              - Greeter.class
              answer: Greeter.java
              explanation: A public class name matches the file name. .class is compiler output.
              difficulty: medium
              mastery_requirement: false
            - slug: java-first-program-q3
              prompt: What is JShell useful for at this stage?
              options:
              - Shipping production services.
              - Quickly evaluating expressions and snippets without writing a full class each time.
              - Replacing the JVM.
              - Compiling C++ DSA code.
              answer: Quickly evaluating expressions and snippets without writing a full class each time.
              explanation: JShell is a REPL. Real programs still use classes and main (or an application
                framework later).
              difficulty: medium
              mastery_requirement: false
            - slug: java-first-program-q4
              prompt: Does watching a getting-started page mark this topic mastered?
              options:
              - Yes, if the page is official.
              - Yes, if Helsinki's first video is finished.
              - 'No: mastery requires writing and running a program plus the questions.'
              - Yes, if you starred the repository.
              answer: 'No: mastery requires writing and running a program plus the questions.'
              explanation: A resource is not mastery.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-first-program-ex1
              title: Hello, then JShell
              instructions: 'Create Greeter.java with a main method that prints two lines (your name and
                a short goal for Java). Compile and run it. Then open JShell and evaluate 3 + 4 * 2; explain
                why the result matches operator precedence. Optional: open the same file in VS Code using
                the Java extension — not required.'
              difficulty: beginner
              order: 0
        - slug: java-compile-and-run
          name: Compile and run
          description: javac compiles source to bytecode (.class). java launches the JVM against a class
            name (not the .java file name with extension, unless you use source-file mode). Modern JDKs
            can run `java Hello.java` for simple programs. You still need to understand classpath and
            that the launcher loads classes. This compile-run loop is the tooling for the rest of Java
            and for running DSA solutions.
          order: 2
          prerequisites:
          - java-first-program
          learning_objective: Use javac/java (or equivalent) reliably and explain .java vs .class.
          mastery_criteria:
          - Explain .java vs .class vs the java launcher.
          - Compile and run from the command line at least once.
          - Inspect that a .class file was produced.
          - Score >= 80% on the topic questions.
          next_topic: java-primitives
          fast_trackable: true
          lessons:
          - slug: java-compile-and-run-core
            title: Compile and run
            description: javac compiles source to bytecode (.class). java launches the JVM against a class
              name (not the .java file name with extension, unless you use source-file mode). Modern JDKs
              can run `java Hello.java` for simple programs. You still need to understand classpath and
              that the launcher loads classes. This compile-run loop is the tooling for the rest of Java
              and for running DSA solutions.
            order: 0
            hours_estimated: 0.75
            resources:
            - slug: java-compile-and-run-primary
              title: Launching simple source-code programs
              type: documentation
              url: https://dev.java/learn/launch-simple-source-code-programs/
              provider: Dev.java
              role: PRIMARY
              description: Modern java launcher, including running .java source files.
              official: true
              order: 0
            - slug: java-compile-and-run-reference
              title: java launcher — Core JDK tools
              type: documentation
              url: https://dev.java/learn/jvm/tools/core/java/
              provider: Dev.java
              role: REFERENCE
              description: Official java tool page.
              official: true
              order: 1
            - slug: java-compile-and-run-practice
              title: Helsinki Part 1 — Getting started
              type: interactive_tutorial
              url: https://java-programming.mooc.fi/part-1/1-starting-programming/
              provider: University of Helsinki
              role: PRACTICE
              description: University of Helsinki Java Programming I/II is the exercise-heavy layer. It
                is a legacy, unmaintained course (historically JDK 11 and NetBeans/TMC). Do not treat
                that toolchain as required. Complete the same exercises with a current JDK using javac/java,
                JShell, or an IDE of your choice. Dev.java is the authoritative modern reference. Environment
                exercises; map them onto javac/java or your IDE run button.
              official: true
              order: 2
            questions:
            - slug: java-compile-and-run-q1
              prompt: After `javac Hello.java`, what do you typically pass to `java`?
              options:
              - Hello.java
              - Hello.class
              - Hello
              - ./Hello.exe
              answer: Hello
              explanation: The launcher wants the class name. Hello.class is the file; Hello.java is source.
              difficulty: medium
              mastery_requirement: true
            - slug: java-compile-and-run-q2
              prompt: What is source-file mode (`java Hello.java`) for?
              options:
              - Replacing the JVM with an interpreter that never uses bytecode.
              - Conveniently compiling and launching simple programs in one step.
              - Running .class files that lost their source.
              - Linking C++ object files into a JAR.
              answer: Conveniently compiling and launching simple programs in one step.
              explanation: It is a launcher convenience. Larger projects still use a build tool and class/JAR
                output.
              difficulty: medium
              mastery_requirement: false
            - slug: java-compile-and-run-q3
              prompt: Why might `java Hello` fail with a class-not-found error even though Hello.java
                is in the folder?
              options:
              - You must rename the file to main.java.
              - The JVM only runs files with a .exe extension.
              - You are in the wrong directory, the class was not compiled, or the package/classpath does
                not match.
              - System.out is not imported.
              answer: You are in the wrong directory, the class was not compiled, or the package/classpath
                does not match.
              explanation: The launcher loads classes from the classpath, not by magically finding any
                nearby source file.
              difficulty: medium
              mastery_requirement: false
            - slug: java-compile-and-run-q4
              prompt: What should you look at to confirm compilation happened?
              options:
              - A Git commit message.
              - A .class file (or build output) produced from the source.
              - The presence of a JRE installer on the desktop.
              - A passing Helsinki quiz without running code.
              answer: A .class file (or build output) produced from the source.
              explanation: Bytecode on disk (or in a build directory) is the compile artifact.
              difficulty: medium
              mastery_requirement: false
            - slug: java-compile-and-run-q5
              prompt: 'VS Code Java workflow is:'
              options:
              - Mandatory for every exercise in this domain.
              - An optional way to compile, run, and debug using the same JDK.
              - A replacement for understanding javac/java.
              - The only way to use JShell.
              answer: An optional way to compile, run, and debug using the same JDK.
              explanation: Dev.java documents VS Code Java; it is not a curriculum gate.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-compile-and-run-ex1
              title: Compile, run, inspect
              instructions: 'Write CompileDemo.java that prints one line. Run `javac CompileDemo.java`,
                confirm CompileDemo.class exists, then `java CompileDemo`. Run once with `java CompileDemo.java`
                if your JDK supports source-file mode. Note any difference in artifacts. Optional: set
                a breakpoint in VS Code and step over the print. Record JDK version used.'
              difficulty: beginner
              order: 0
      - slug: mod-java-variables-types
        name: Variables & Types
        order: 1
        topics:
        - slug: java-primitives
          name: Primitives
          description: Java primitives are boolean, byte, short, int, long, float, double, and char. They
            are not objects. String is a reference type (a class), even though it has literals. `var`
            infers a type from the initializer; it is not a dynamic type. Uninitialized local variables
            cannot be read. Prefer explicit types while learning; use var when the type is obvious.
          order: 0
          prerequisites:
          - java-compile-and-run
          learning_objective: Declare, initialize, and choose Java primitive types; distinguish them from
            String and other references.
          mastery_criteria:
          - List the primitive types and contrast them with String.
          - Choose types for integers, floating values, flags, and characters.
          - Explain what var does and does not do.
          - Score >= 80% on the topic questions.
          next_topic: java-type-conversion
          fast_trackable: true
          lessons:
          - slug: java-primitives-core
            title: Primitives
            description: Java primitives are boolean, byte, short, int, long, float, double, and char.
              They are not objects. String is a reference type (a class), even though it has literals.
              `var` infers a type from the initializer; it is not a dynamic type. Uninitialized local
              variables cannot be read. Prefer explicit types while learning; use var when the type is
              obvious.
            order: 0
            hours_estimated: 0.75
            resources:
            - slug: java-primitives-primary
              title: Helsinki Part 1 — Variables
              type: interactive_tutorial
              url: https://java-programming.mooc.fi/part-1/4-variables/
              provider: University of Helsinki
              role: PRIMARY
              description: University of Helsinki Java Programming I/II is the exercise-heavy layer. It
                is a legacy, unmaintained course (historically JDK 11 and NetBeans/TMC). Do not treat
                that toolchain as required. Complete the same exercises with a current JDK using javac/java,
                JShell, or an IDE of your choice. Dev.java is the authoritative modern reference. Variable
                declaration and first typed values.
              official: true
              order: 0
            - slug: java-primitives-reference
              title: Creating primitive type variables
              type: documentation
              url: https://dev.java/learn/language-basics/primitive-types/
              provider: Dev.java
              role: REFERENCE
              description: Authoritative primitive-type syntax and initialization.
              official: true
              order: 1
            - slug: java-primitives-deep
              title: Using the var type identifier
              type: documentation
              url: https://dev.java/learn/language-basics/using-var/
              provider: Dev.java
              role: DEEP_DIVE
              description: Local-variable type inference. Not a substitute for understanding actual types.
              official: true
              order: 2
            questions:
            - slug: java-primitives-q1
              prompt: Which statement is true?
              options:
              - String is a primitive type like int.
              - int is a primitive; String is a reference to an object.
              - boolean is stored as a String of "true" or "false".
              - char and String are the same type.
              answer: int is a primitive; String is a reference to an object.
              explanation: Primitives are not objects. String lives on the heap as an object.
              difficulty: medium
              mastery_requirement: true
            - slug: java-primitives-q2
              prompt: What happens if you read a local `int x;` with no initializer?
              options:
              - It is 0.
              - It is null.
              - The code does not compile.
              - It is a random leftover value like C.
              answer: The code does not compile.
              explanation: Java local variables must be definitely assigned before use.
              difficulty: medium
              mastery_requirement: false
            - slug: java-primitives-q3
              prompt: '`var n = 3;` — what is n''s type?'
              options:
              - Object
              - var
              - int
              - Integer always
              answer: int
              explanation: var infers int from the integer literal. var is not a runtime type.
              difficulty: medium
              mastery_requirement: false
            - slug: java-primitives-q4
              prompt: Why is `double` a better default than `float` for most application math?
              options:
              - float cannot represent fractions.
              - double is the default floating type in Java literals like 1.0 and usually has more precision.
              - float is deprecated.
              - double is a reference type and therefore safer.
              answer: double is the default floating type in Java literals like 1.0 and usually has more
                precision.
              explanation: Use float only when you have a reason (memory, APIs).
              difficulty: medium
              mastery_requirement: false
            - slug: java-primitives-q5
              prompt: Which type stores a single UTF-16 code unit?
              options:
              - byte
              - boolean
              - char
              - String
              answer: char
              explanation: char is a 16-bit numeric type. A full Unicode character may need a surrogate
                pair or a String.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-primitives-ex1
              title: Type conversion notebook
              instructions: Write TypesDemo with locals of each primitive plus a String. Print their values.
                Add `var inferred = 42;` and print inferred's value. In comments, state which of those
                variables are primitives vs references. Then write a tiny utility method that takes an
                int minutes and returns a double hours (minutes / 60.0).
              difficulty: beginner
              order: 0
        - slug: java-type-conversion
          name: Type conversion
          description: Widening conversions (int → long → float → double) can be implicit. Narrowing (double
            → int, long → int) needs a cast and can truncate. Integer overflow wraps in two's complement;
            it does not throw. Mixing int division (`5 / 2`) truncates. Boxing (int ↔ Integer) is separate
            from primitive widening — see autoboxing later when you use collections.
          order: 1
          prerequisites:
          - java-primitives
          learning_objective: Apply widening and narrowing conversions and explain overflow.
          mastery_criteria:
          - Predict implicit vs explicit conversion.
          - Explain one overflow and one integer-division surprise.
          - Score >= 80% on the topic questions.
          next_topic: java-console-io
          fast_trackable: true
          lessons:
          - slug: java-type-conversion-core
            title: Type conversion
            description: Widening conversions (int → long → float → double) can be implicit. Narrowing
              (double → int, long → int) needs a cast and can truncate. Integer overflow wraps in two's
              complement; it does not throw. Mixing int division (`5 / 2`) truncates. Boxing (int ↔ Integer)
              is separate from primitive widening — see autoboxing later when you use collections.
            order: 0
            hours_estimated: 0.5
            resources:
            - slug: java-type-conversion-primary
              title: Helsinki Part 1 — Calculating with numbers
              type: interactive_tutorial
              url: https://java-programming.mooc.fi/part-1/5-calculating/
              provider: University of Helsinki
              role: PRIMARY
              description: University of Helsinki Java Programming I/II is the exercise-heavy layer. It
                is a legacy, unmaintained course (historically JDK 11 and NetBeans/TMC). Do not treat
                that toolchain as required. Complete the same exercises with a current JDK using javac/java,
                JShell, or an IDE of your choice. Dev.java is the authoritative modern reference. Arithmetic
                and numeric calculations; watch integer division.
              official: true
              order: 0
            - slug: java-type-conversion-reference
              title: Primitive types
              type: documentation
              url: https://dev.java/learn/language-basics/primitive-types/
              provider: Dev.java
              role: REFERENCE
              description: Primitive declarations; combine with the internal lesson on widening/narrowing.
              official: true
              order: 1
            - slug: java-type-conversion-deep
              title: Autoboxing and unboxing
              type: documentation
              url: https://dev.java/learn/numbers-strings/autoboxing/
              provider: Dev.java
              role: DEEP_DIVE
              description: Primitive vs wrapper conversions. Collections store wrappers, not raw ints.
              official: true
              order: 2
            questions:
            - slug: java-type-conversion-q1
              prompt: What does `(int) 3.9` evaluate to?
              options:
              - '4'
              - '3'
              - '3.9'
              - compile error
              answer: '3'
              explanation: Casting toward int truncates toward zero; it does not round.
              difficulty: medium
              mastery_requirement: true
            - slug: java-type-conversion-q2
              prompt: What is `1_000_000 * 1_000_000` if both are int?
              options:
              - 10^12 exactly as an int.
              - An overflowed int; the mathematical product does not fit in 32 bits.
              - A compile error because underscores are illegal.
              - Automatically promoted to long.
              answer: An overflowed int; the mathematical product does not fit in 32 bits.
              explanation: int arithmetic wraps. Use long literals (1_000_000L) when the product needs
                64 bits.
              difficulty: medium
              mastery_requirement: false
            - slug: java-type-conversion-q3
              prompt: Why is `5 / 2` equal to 2 rather than 2.5?
              options:
              - Java cannot represent 2.5.
              - Both operands are ints, so the division is integer division.
              - Operator / always truncates, even for doubles.
              - You forgot to import Math.
              answer: Both operands are ints, so the division is integer division.
              explanation: Write 5 / 2.0 or cast to get floating division.
              difficulty: medium
              mastery_requirement: false
            - slug: java-type-conversion-q4
              prompt: 'Assigning an int to a long without a cast is allowed because:'
              options:
              - long is smaller than int.
              - It is a widening conversion that cannot overflow the destination type.
              - The compiler always inserts a runtime check.
              - int and long are the same size.
              answer: It is a widening conversion that cannot overflow the destination type.
              explanation: Every int value fits in a long.
              difficulty: medium
              mastery_requirement: false
            exercises:
