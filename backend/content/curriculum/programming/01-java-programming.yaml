            - slug: java-method-basics-q2
              prompt: 'void bump(int n) { n++; } called as bump(x); — x in the caller:'
              options:
              - Always increases.
              - Is unchanged; n is a copy of the primitive value.
              - Becomes null.
              - Does not compile.
              answer: Is unchanged; n is a copy of the primitive value.
              explanation: Pass-by-value of the int.
              difficulty: medium
              mastery_requirement: false
            - slug: java-method-basics-q3
              prompt: 'void append(StringBuilder sb) { sb.append("!"); } — after append(callerSb):'
              options:
              - callerSb is unchanged because Java is pass-by-value.
              - The same StringBuilder object is mutated; the caller's reference still points at it.
              - callerSb is reassigned to a new object automatically.
              - StringBuilder cannot be a parameter.
              answer: The same StringBuilder object is mutated; the caller's reference still points at
                it.
              explanation: The reference is copied; both copies point at one mutable object. Not pass-by-reference.
              difficulty: medium
              mastery_requirement: false
            - slug: java-method-basics-q4
              prompt: 'void rebind(StringBuilder sb) { sb = new StringBuilder("z"); } — caller:'
              options:
              - Now points at "z".
              - Still points at the original object; only the parameter was rebound.
              - Is set to null.
              - Throws.
              answer: Still points at the original object; only the parameter was rebound.
              explanation: Rebinding the copy does not rebind the caller's variable.
              difficulty: medium
              mastery_requirement: false
            - slug: java-method-basics-q5
              prompt: Why split a 80-line main into methods before DSA?
              options:
              - The JVM requires fewer than 20 lines in main.
              - You need named operations you can test, reuse, and later put on arrays/lists.
              - Helsinki forbids main after part 2.
              - Methods make programs slower, which trains complexity.
              answer: You need named operations you can test, reuse, and later put on arrays/lists.
              explanation: Decomposition is the skill DSA solutions need.
              difficulty: medium
              mastery_requirement: false
            - slug: java-method-basics-q6
              prompt: 'A first recursion (factorial/sum) is introduced here as:'
              options:
              - Required for all later DSA.
              - A method that calls itself with a smaller argument and a base case.
              - The only way to write a loop in Java.
              - Undefined in Java.
              answer: A method that calls itself with a smaller argument and a base case.
              explanation: Loops remain the default. Recursion returns in DSA with trees.
              difficulty: medium
              mastery_requirement: false
            - slug: java-method-basics-q7
              prompt: 'static methods on a simple exercise class are used because:'
              options:
              - They are faster than instances always.
              - You can call them from main without constructing an object.
              - Non-static methods are deprecated.
              - DSA forbids objects.
              answer: You can call them from main without constructing an object.
              explanation: Instance methods become natural once you have classes.
              difficulty: medium
              mastery_requirement: false
