              prompt: 'Default PriorityQueue of Integer polls:'
              options:
              - Largest first.
              - Smallest first (min-heap / natural order).
              - Insertion order.
              - Random.
              answer: Smallest first (min-heap / natural order).
              explanation: C++ priority_queue defaults to max-heap — a transfer trap.
              difficulty: medium
              mastery_requirement: true
            - slug: java-priority-queue-q2
              prompt: 'ArrayDeque vs PriorityQueue:'
              options:
              - They are identical.
              - ArrayDeque is FIFO/LIFO; PriorityQueue retrieves by priority.
              - ArrayDeque sorts always.
              - PriorityQueue is a List.
              answer: ArrayDeque is FIFO/LIFO; PriorityQueue retrieves by priority.
              explanation: C++ deque vs priority_queue.
              difficulty: medium
              mastery_requirement: false
            - slug: java-priority-queue-q3
              prompt: 'pq.peek() vs poll():'
              options:
              - Both remove.
              - peek views the head; poll removes it.
              - peek throws if empty always the same as get(0).
              - poll sorts the entire structure into a list.
              answer: peek views the head; poll removes it.
              explanation: 'Empty: null or throw depending on Queue method (peek vs element).'
              difficulty: medium
              mastery_requirement: false
            - slug: java-priority-queue-q4
              prompt: 'Iterating a PriorityQueue with enhanced for:'
              options:
              - Visits elements in sorted order always.
              - Does not guarantee sorted order; only poll order is the heap order.
              - Is illegal.
              - Reverses the heap.
              answer: Does not guarantee sorted order; only poll order is the heap order.
              explanation: Don't print-for-each and assume sorted.
              difficulty: medium
              mastery_requirement: false
            - slug: java-priority-queue-q5
              prompt: 'This topic is a heap DSA prerequisite because:'
              options:
              - PriorityQueue is the usual Java heap.
