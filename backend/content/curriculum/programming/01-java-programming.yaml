              - An Error only.
              - Not an exception.
              answer: Unchecked (RuntimeException); the compiler does not force you to catch it.
              explanation: Fix the null; don't catch NPE as a style.
              difficulty: medium
              mastery_requirement: true
            - slug: java-checked-unchecked-q2
              prompt: 'A method that calls a checked-throwing API and does not catch must:'
