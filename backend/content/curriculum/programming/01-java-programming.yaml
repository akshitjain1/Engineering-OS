              title: Search then skip
              instructions: Given a hardcoded int array, print the first even number (use break) then
                in a second loop print all odd numbers (use continue to skip evens). Rewrite the second
                loop without continue. Which version do you prefer and why?
              difficulty: beginner
              order: 0
      - slug: mod-java-methods
