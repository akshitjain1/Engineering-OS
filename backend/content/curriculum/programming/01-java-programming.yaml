        - slug: java-checked-unchecked
          name: Checked and unchecked
          description: 'Unchecked: RuntimeException and Error — compiler does not require catch/throws
            (NPE, IAE, IOBE). Checked: other Exception subclasses — callers must catch or declare throws
            (classic IOException). APIs disagree on how much checked is good; don''t invent checked exceptions
            for every domain miss. Propagation: if you cannot handle it, declare throws or wrap.'
          order: 1
          prerequisites:
          - java-try-catch
          learning_objective: Distinguish checked vs unchecked exceptions and choose throws vs handle.
          mastery_criteria:
          - Classify NPE vs IOException.
          - Write a method that declares throws for a checked exception it does not handle.
          - Score >= 80% on the topic questions.
          next_topic: java-custom-exceptions
