              - The JVM locating and linking .class bytes into a usable class.
              - javac only.
              - Git fetch.
              answer: The JVM locating and linking .class bytes into a usable class.
              explanation: Wrong classpath → NoClassDefFoundError / ClassNotFoundException.
              difficulty: medium
              mastery_requirement: false
            - slug: java-bytecode-q3
              prompt: 'JIT means:'
              options:
              - The interpreter is deleted on install.
              - Hot methods may be compiled to native code at runtime for speed.
              - You must run javap before java.
              - Bytecode is never executed.
              answer: Hot methods may be compiled to native code at runtime for speed.
              explanation: That's why warm-up exists in benchmarks.
              difficulty: medium
              mastery_requirement: false
            - slug: java-bytecode-q4
              prompt: Do you need bytecode to write DSA?
              options:
              - Yes, every solution.
              - No; it explains how Java runs.
              - Yes, for arrays only.
              - Yes, for HashMap.
              answer: No; it explains how Java runs.
              explanation: Not a DSA gate.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-bytecode-ex1
              title: javap a method
              instructions: Write a class with a small add(int,int). javac it. Run `javap -c ClassName`
                and paste 5–10 lines of output into comments. Circle (in comments) that you see an iadd
                or similar. No opcode memorization.
              difficulty: beginner
              order: 0
        - slug: java-memory-model-basics
          name: Memory model basics
          description: Each method call has a stack frame (locals, including references). Objects live
            on the heap (programmer model). The Java Memory Model also defines visibility between threads
            — you saw that in synchronization. There is no dedicated Dev.java 'heap vs stack' chapter;
            this is an internal lesson plus GC as heap context. Not JVM internals / not a DSA gate.
          order: 1
          prerequisites:
          - java-bytecode
          learning_objective: Name heap vs stack at a Java programmer level and place objects vs frames.
          mastery_criteria:
          - Sketch stack frames pointing at heap objects for a short program.
          - Score >= 80% on the topic questions.
          next_topic: java-gc-intro
          fast_trackable: true
          lessons:
          - slug: java-memory-model-basics-core
            title: Memory model basics
            description: Each method call has a stack frame (locals, including references). Objects live
              on the heap (programmer model). The Java Memory Model also defines visibility between threads
              — you saw that in synchronization. There is no dedicated Dev.java 'heap vs stack' chapter;
              this is an internal lesson plus GC as heap context. Not JVM internals / not a DSA gate.
            order: 0
            hours_estimated: 0.75
            resources:
            - slug: java-memory-model-basics-reference
              title: Garbage collection overview
              type: documentation
              url: https://dev.java/learn/jvm/tool/garbage-collection/
              provider: Dev.java
              role: REFERENCE
              description: GC runs on heap objects. No verified PRIMARY course URL for stack-vs-heap;
                the lesson text is authoritative here.
              official: true
              order: 0
            questions:
            - slug: java-memory-model-basics-q1
              prompt: 'int x = 3; in a method typically lives:'
              options:
              - On the heap as an Integer always.
              - In the stack frame as a primitive local.
              - In the .java file at runtime.
              - In the instruction cache only.
              answer: In the stack frame as a primitive local.
              explanation: Integer.valueOf(3) would be a heap object.
              difficulty: medium
              mastery_requirement: true
            - slug: java-memory-model-basics-q2
              prompt: 'Node n = new Node():'
              options:
              - The Node object is on the heap; n (the reference) is in the frame.
              - The entire object is in CPU registers forever.
              - n is stored in the .class constant pool only.
              - Java has no heap.
              answer: The Node object is on the heap; n (the reference) is in the frame.
              explanation: Linked lists are heap graphs.
              difficulty: medium
              mastery_requirement: false
            - slug: java-memory-model-basics-q3
              prompt: 'Escape / ''memory model'' between threads:'
              options:
              - Stack frames are shared by all threads always.
              - Each thread has its own stack; the heap is shared — hence races.
              - Heaps are per-thread and never shared.
              - GC disables threads.
              answer: Each thread has its own stack; the heap is shared — hence races.
              explanation: Enough for this curriculum.
              difficulty: medium
              mastery_requirement: false
            - slug: java-memory-model-basics-q4
              prompt: 'Why this is not a JVM-spec course:'
              options:
              - Programmers need a model for NPE, GC, and races — not interpreter source.
              - You must implement a JVM.
              - DSA requires compressed oops.
              - Helsinki Part 14 is the JVM spec.
              answer: Programmers need a model for NPE, GC, and races — not interpreter source.
              explanation: Stop at the picture you can draw.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-memory-model-basics-ex1
              title: Draw the frames
              instructions: 'Write method a() { Box b = new Box(); c(b); } method c(Box x) { x.v++; }.
                ASCII-draw: frames a and c, heap Box, both references. Mark what ++ mutates. No PRIMARY
                URL exists for this picture — that is expected.'
              difficulty: beginner
              order: 0
        - slug: java-gc-intro
          name: Garbage collection intro
          description: 'Garbage collection frees heap objects that are not reachable from GC roots (stacks,
            statics, etc.). You don''t call free(). Memory leaks in Java are usually accidental retained
            references. Tuning collectors is out of scope. Profiling awareness: jcmd/JFR exist; you don''t
            need them daily yet.'
          order: 2
          prerequisites:
          - java-memory-model-basics
          learning_objective: Explain reachability and that GC reclaims unreachable objects.
          mastery_criteria:
          - Explain reachability vs leak via a lingering static list.
          - Score >= 80% on the topic questions.
          next_topic: java-packages
          fast_trackable: true
          lessons:
          - slug: java-gc-intro-core
            title: Garbage collection intro
            description: 'Garbage collection frees heap objects that are not reachable from GC roots (stacks,
              statics, etc.). You don''t call free(). Memory leaks in Java are usually accidental retained
              references. Tuning collectors is out of scope. Profiling awareness: jcmd/JFR exist; you
              don''t need them daily yet.'
            order: 0
            hours_estimated: 0.75
            resources:
            - slug: java-gc-intro-primary
              title: Garbage collection overview
              type: documentation
              url: https://dev.java/learn/jvm/tool/garbage-collection/
              provider: Dev.java
              role: PRIMARY
              description: Official GC overview. Do not tune G1/ZGC here.
              official: true
              order: 0
            questions:
            - slug: java-gc-intro-q1
              prompt: 'An object is eligible for GC when:'
              options:
              - The constructor finishes.
              - No GC root can reach it.
              - It goes out of the source file.
              - You print it.
              answer: No GC root can reach it.
              explanation: Cycles of unreachable objects can still be collected.
              difficulty: medium
              mastery_requirement: true
            - slug: java-gc-intro-q2
              prompt: 'static List<byte[]> cache that only grows:'
              options:
              - Helps GC.
              - 'A retention leak: objects stay reachable.'
              - Required for HashMap.
              - Frees memory automatically still.
              answer: 'A retention leak: objects stay reachable.'
              explanation: GC cannot collect what you still point at.
              difficulty: medium
              mastery_requirement: false
            - slug: java-gc-intro-q3
              prompt: 'System.gc():'
              options:
              - Guarantees a full collection now.
              - A suggestion; not a resource-management API.
              - Closes files.
              - Stops the world forever.
              answer: A suggestion; not a resource-management API.
              explanation: Don't write System.gc() in app code as a habit.
              difficulty: medium
              mastery_requirement: false
            - slug: java-gc-intro-q4
              prompt: 'Profiling awareness means:'
              options:
              - You must master JFR this week.
              - You know tools exist (JFR, VisualVM, etc.) when allocation is actually a problem.
              - GC replaces Big-O.
              - DSA requires GC tuning.
              answer: You know tools exist (JFR, VisualVM, etc.) when allocation is actually a problem.
              explanation: Not a DSA gate.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-gc-intro-ex1
              title: Reachability paragraph
              instructions: 'Write 8–10 sentences: roots, reachable objects, a leak via a static collection,
                why unused locals can be GC''d after last use (conceptually). Optional: after javap topic,
                note that allocation is `new` in bytecode. Do not tune flags.'
              difficulty: beginner
              order: 0
