              - Ignore it.
              - Declare throws of that checked type (or a supertype).
              - Be native.
              - Use var.
              answer: Declare throws of that checked type (or a supertype).
              explanation: The compiler tracks checked exceptions.
              difficulty: medium
              mastery_requirement: false
            - slug: java-checked-unchecked-q3
              prompt: 'Wrapping a checked exception in a RuntimeException is:'
              options:
              - Always evil.
              - A common way to propagate when your layer cannot handle I/O but does not want throws on
                every method — use deliberately.
              - Required by HashMap.
              - The same as swallowing.
              answer: A common way to propagate when your layer cannot handle I/O but does not want throws
                on every method — use deliberately.
