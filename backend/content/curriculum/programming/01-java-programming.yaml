        - slug: java-priority-queue
          name: PriorityQueue
          description: 'PriorityQueue is a heap: poll gives the least element by natural or Comparator
            order (head is the smallest by default). It is not a sorted list — only the head is cheap.
            ArrayDeque is the usual queue/stack (C++ deque). C++ priority_queue is the analogue of PriorityQueue
            (and is a max-heap by default — Java''s is min-heap by Comparable). DSA connection: heaps
            in Domain 2 use PriorityQueue plus Comparable/Comparator. C++ analogue: priority_queue. Streams
            are not required.'
