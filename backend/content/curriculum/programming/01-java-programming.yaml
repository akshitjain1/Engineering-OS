              answer: Throws a checked IOException (typically NoSuchFileException).
              explanation: Catch at a layer that can tell the user.
              difficulty: medium
              mastery_requirement: false
            - slug: java-paths-files-q3
              prompt: 'Relative Path.of("data.txt") is relative to:'
              options:
              - The source file folder always.
              - The JVM's working directory.
              - The JDK install path.
              - Git root always.
