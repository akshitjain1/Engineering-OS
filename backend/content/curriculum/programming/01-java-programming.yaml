            `a = new ...` does not change b. This is the mental model for linked lists, trees, and graphs.
            Java is not pass-by-reference. DSA connection: linked lists, trees, and graphs in Domain 2
            depend on classes plus reference/aliasing semantics. Java is pass-by-value; the value copied
            for objects is the reference.'
