            questions:
            - slug: java-encapsulation-q1
              prompt: 'A public int balance field is risky because:'
              options:
              - ints cannot be public.
              - callers can violate invariants without going through methods.
              - the JVM ignores public.
              - private is slower.
              answer: callers can violate invariants without going through methods.
              explanation: withdraw() can check funds; a field write cannot.
              difficulty: medium
              mastery_requirement: true
            - slug: java-encapsulation-q2
              prompt: 'Getters/setters for every field:'
              options:
              - Are required by Java.
              - Can be pointless or harmful if they expose a mutable representation with no rules.
              - Replace constructors.
              - Are forbidden in interviews.
              answer: Can be pointless or harmful if they expose a mutable representation with no rules.
              explanation: Expose behavior (deposit), not a bag of fields.
              difficulty: medium
              mastery_requirement: false
            - slug: java-encapsulation-q3
              prompt: 'Returning the internal List field from getItems():'
              options:
              - Always fine.
              - Lets callers mutate internals unless you copy or return an unmodifiable view.
              - Makes the list private automatically.
              - Is required for DSA.
              answer: Lets callers mutate internals unless you copy or return an unmodifiable view.
              explanation: Encapsulation is about representation hiding.
              difficulty: medium
              mastery_requirement: false
            - slug: java-encapsulation-q4
              prompt: 'Cohesion means:'
              options:
              - One class does networking, parsing, and UI.
              - A class's methods belong to one responsibility.
              - All fields are public.
              - Using inheritance always.
              answer: A class's methods belong to one responsibility.
              explanation: Split UI from domain (Helsinki also separates UI from logic).
              difficulty: medium
              mastery_requirement: false
            - slug: java-encapsulation-q5
              prompt: 'private vs package vs public:'
              options:
              - Only public exists in Java.
              - private is class-only; default is package; public is API.
              - private methods cannot call each other.
              - public fields are required for main.
              answer: private is class-only; default is package; public is API.
              explanation: protected waits for inheritance.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: java-encapsulation-ex1
              title: Invariant BankAccount
              instructions: 'Private balanceCents. deposit/withdraw throw or return false on invalid amounts
                (your choice, be consistent). No public setter for balance. Write a main that tries to
                break the invariant and cannot. In comments: would a getter for balance be OK? (yes, read-only)
                Why no setter?'
              difficulty: intermediate
              order: 0
        - slug: java-inheritance
          name: Inheritance
          description: 'extends creates an is-a relationship. Subclasses inherit accessible members, override
            methods, and chain constructors with super(). protected is for subclass access. Inheritance
            is not the default design tool: a fragile hierarchy is worse than composition. After the exercise,
            answer: would composition be better?'
          order: 4
          prerequisites:
          - java-encapsulation
          learning_objective: Extend a class with super/override and judge when composition is the better
            is-a vs has-a choice.
          mastery_criteria:
          - Implement a small hierarchy with super and override.
          - Explain is-a vs has-a and a limitation of inheritance.
          - Score >= 80% on the topic questions.
          next_topic: java-polymorphism
          fast_trackable: true
          lessons:
