              - 'Same keyword, different enclosing structure: ends the switch or the loop.'
              - break in a loop compiles only on Friday.
              - continue works in switch the same as break.
              answer: 'Same keyword, different enclosing structure: ends the switch or the loop.'
              explanation: Arrow switch cases do not need break.
              difficulty: medium
              mastery_requirement: false
            exercises:
