        - slug: dsa-stack-fundamentals
          name: Stack fundamentals
          description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. Implement in Java. C++ is an equivalence
            note, not a second curriculum. A stack is Last-In-First-Out (LIFO): push adds on top, pop
            removes the most recent. In Java use `ArrayDeque` as a stack (`push`/`pop`/`peek`). Java ArrayDeque
            ≈ C++ deque. Prefer ArrayDeque over legacy java.util.Stack. Do not treat `java.util.Stack`
            as the preferred API — it extends `Vector`, is synchronized, and is legacy. C++ `std::stack`
            is the same LIFO idea. Stacks model nested structure: parentheses matching, undo, DFS frames,
            and evaluating postfix notation. Watching Abdul Bari on the stack ADT is orientation; mastery
            is implement + trace + problems.'
