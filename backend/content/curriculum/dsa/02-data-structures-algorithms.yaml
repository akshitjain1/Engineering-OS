            taking the best-looking local option. It works when greedy-choice and optimal substructure
            hold (often proved by exchange argument). Classic failure: coin change with coins [1,3,4]
            and amount 6 — greedy takes 4+1+1 (3 coins) but optimal is 3+3 (2 coins). That tempting greedy
