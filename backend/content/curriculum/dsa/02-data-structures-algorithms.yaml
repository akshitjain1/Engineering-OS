          description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. Implement in Java. C++ is an equivalence
            note, not a second curriculum. Dijkstra: maintain dist[s]=0, others INF; min-heap on (distance,
            node); pop smallest, relax edges if dist[u]+w < dist[v]. Requires non-negative edge weights
            — negative edges invalidate the greedy pop invariant. Java PriorityQueue is a min-heap by
            default. C++ priority_queue is a max-heap by default. Invert with Comparator / greater<>.
            Use PriorityQueue as min-heap. Bellman-Ford handles negative edges (MIT L12 deep dive on why
            Dijkstra fails — not V1 implementation).'
