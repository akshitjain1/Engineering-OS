              - Subproblems never repeat.
              - Only graphs overlap.
              - Arrays cannot overlap.
              answer: The same subproblem is solved many times in naive recursion.
              explanation: Memo/tabulation exist to pay each subproblem once.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-dp-mindset-q2
              prompt: 'Optimal substructure means:'
              options:
              - An optimal solution uses optimal solutions to subproblems.
              - Every subproblem is independent.
              - Greedy always works.
              - Only trees have it.
              answer: An optimal solution uses optimal solutions to subproblems.
              explanation: Verify before applying DP.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-dp-mindset-q3
              prompt: 'Memoization vs tabulation:'
              options:
              - Top-down cache vs bottom-up fill; same recurrence often.
              - Tabulation is always faster.
              - Memoization cannot use arrays.
              - They are unrelated.
              answer: Top-down cache vs bottom-up fill; same recurrence often.
              explanation: Pick based on state shape and iteration order.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-dp-mindset-q4
              prompt: 'A DP state should be:'
              options:
              - Minimal information to describe a subproblem uniquely.
              - The entire input copied.
              - Always one integer.
              - Always a graph.
              answer: Minimal information to describe a subproblem uniquely.
              explanation: Most DP bugs are bad state definition.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-dp-mindset-q5
              prompt: 'Fill ORDER matters when:'
              options:
              - A transition depends on not-yet-computed states in the same table.
              - Never.
              - Only in greedy.
              - Only in BFS.
              answer: A transition depends on not-yet-computed states in the same table.
              explanation: 0/1 knapsack iterates capacity descending per item.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-dp-mindset-q6
              prompt: 'Space optimization to O(1) or O(n) is valid when:'
