              - Subproblems never repeat.
              - Only graphs overlap.
              - Arrays cannot overlap.
              answer: The same subproblem is solved many times in naive recursion.
              explanation: Memo/tabulation exist to pay each subproblem once.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-tabulation-q2
              prompt: 'Optimal substructure means:'
              options:
              - An optimal solution uses optimal solutions to subproblems.
              - Every subproblem is independent.
              - Greedy always works.
              - Only trees have it.
              answer: An optimal solution uses optimal solutions to subproblems.
              explanation: Verify before applying DP.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-tabulation-q3
              prompt: 'Memoization vs tabulation:'
              options:
              - Top-down cache vs bottom-up fill; same recurrence often.
              - Tabulation is always faster.
              - Memoization cannot use arrays.
              - They are unrelated.
              answer: Top-down cache vs bottom-up fill; same recurrence often.
              explanation: Pick based on state shape and iteration order.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-tabulation-q4
              prompt: 'A DP state should be:'
