      modules:
      - slug: mod-dsa-algorithmic-thinking
        name: Algorithmic Thinking
        order: 0
        topics:
        - slug: dsa-algorithmic-thinking
          name: Algorithmic thinking
          description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. Algorithmic thinking is language-independent:
            define input and output, write two small examples (including an edge case), state an invariant
            or brute-force sketch, then choose a structure. You already decompose problems in C++; Java
            is the interview implementation language. Implement in Java. C++ is an equivalence note, not
            a second curriculum. Watching Abdul Bari or MIT lectures clarifies vocabulary — it is not
            mastery.'
          order: 0
          prerequisites:
          - cf-time-complexity-intro
          - java-method-basics
          learning_objective: Approach problems with input/output, invariants, and worked examples before
            coding.
          mastery_criteria:
          - Explain the core idea without notes (language-independent).
          - Implement the pattern in Java without copying a solution.
          - State the C++ equivalent structure at a high level where it applies.
          - Solve 2–3 representative NeetCode 150 problems in the listed category.
          - 'Transfer: solve a similar unseen problem without hints.'
          - State time and space complexity of your approach.
          - Score >= 80% on topic questions.
          next_topic: dsa-big-o
          fast_trackable: true
          lessons:
          - slug: dsa-algorithmic-thinking-core
            title: Algorithmic thinking
            description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
              and deeper reasoning, not a first course in programming. Algorithmic thinking is language-independent:
              define input and output, write two small examples (including an edge case), state an invariant
              or brute-force sketch, then choose a structure. You already decompose problems in C++; Java
              is the interview implementation language. Implement in Java. C++ is an equivalence note,
              not a second curriculum. Watching Abdul Bari or MIT lectures clarifies vocabulary — it is
              not mastery.'
            order: 0
            hours_estimated: 1.0
            resources:
            - slug: dsa-algorithmic-thinking-primary
              title: Abdul Bari — 1. Introduction to Algorithms
              type: youtube_video
              url: https://www.youtube.com/watch?v=0IAPZzGSbME
              provider: Abdul Bari
              role: PRIMARY
              description: Official Abdul Bari video (author verified via YouTube oEmbed).
              official: true
              order: 0
            - slug: dsa-algorithmic-thinking-mit
              title: MIT 6.006 Lecture 1 — Algorithms and Computation
              type: documentation
              url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/lecture-1-algorithms-and-computation/
              provider: MIT OCW 6.006
              role: DEEP_DIVE
              description: Optional MIT 6.006 lecture page. Not mandatory. Do not complete the entire
                course.
              official: true
              order: 1
            questions:
            - slug: dsa-algorithmic-thinking-q1
              prompt: Before writing Java for an unfamiliar prompt, what is the highest-value first step?
              options:
              - Memorize a LeetCode solution template.
              - Define input/output, write two examples, and sketch brute force.
              - Import every java.util class.
              - Optimize for O(1) space immediately.
              answer: Define input/output, write two examples, and sketch brute force.
              explanation: Concrete I/O and examples expose edge cases and guide structure choice.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-algorithmic-thinking-q2
              prompt: 'An invariant is best described as:'
              options:
              - A Java keyword for loops.
              - A condition that stays true across algorithm steps and justifies correctness.
              - The worst-case time bound.
              - A comment required by the compiler.
              answer: A condition that stays true across algorithm steps and justifies correctness.
              explanation: Invariants connect each step to the final answer.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-algorithmic-thinking-q3
              prompt: 'You know the C++ solution uses std::unordered_map. In Java you should first ask:'
              options:
              - Whether HashMap gives the same expected O(1) keyed lookup role.
              - Whether Java has pointers.
              - Whether to rewrite in assembly.
              - Whether String is mutable.
              answer: Whether HashMap gives the same expected O(1) keyed lookup role.
              explanation: Java HashMap ≈ C++ unordered_map; TreeMap ≈ map. Map the algorithmic role,
                not syntax trivia.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-algorithmic-thinking-q4
              prompt: Why write a brute-force version before optimizing?
              options:
              - Brute force is always the interview answer.
              - It proves the problem is understood and gives a correctness baseline.
              - Java cannot express optimized code without brute force first.
              - NeetCode requires brute force submissions.
              answer: It proves the problem is understood and gives a correctness baseline.
              explanation: Optimization without understanding risks subtle bugs.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-algorithmic-thinking-q5
              prompt: 'Edge cases in problem setup usually include:'
              options:
              - Only inputs of length exactly 10.
              - Empty input, single element, duplicates, and boundary indices.
              - Only positive numbers.
              - Only inputs that fit recursion depth 1000.
              answer: Empty input, single element, duplicates, and boundary indices.
              explanation: Small degenerate inputs break naive loops and indexing.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-algorithmic-thinking-q6
              prompt: 'After watching an algorithms video, mastery requires:'
              options:
              - Rewatching until the playlist ends.
              - Implementing, tracing on paper, and solving representative problems.
              - Bookmarking the video.
              - Copying slides into notes without coding.
              answer: Implementing, tracing on paper, and solving representative problems.
              explanation: Video is orientation; implementation and problems are mastery.
              difficulty: medium
              mastery_requirement: true
            exercises:
            - slug: dsa-algorithmic-thinking-ex1
              title: Problem setup drill
              instructions: 'IMPLEMENT: Write only the Java method signature (no body) for: given int[]
                nums and int target, return indices of two numbers that sum to target. TRACE/EXPLAIN:
                For nums=[2,7,11,15], target=9, document input, output, brute-force steps, and one invariant
                a one-pass HashMap approach would maintain. SOLVE: From NeetCode 150 Arrays & Hashing,
                solve Two Sum and Contains Duplicate. TRANSFER (internal): Package IDs arrive in order;
                find the first duplicate ID — outline approach and complexity without looking up a solution.'
              difficulty: intermediate
              order: 0
      - slug: mod-dsa-complexity
        name: Complexity Analysis
        order: 1
        topics:
        - slug: dsa-big-o
          name: Big-O notation
          description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. Big-O describes asymptotic growth:
            constant factors and lower terms drop out. Count dominant operations in loops — one loop over
            n is O(n), nested loops often O(n²). This formalizes Domain 0''s complexity intro. Same reasoning
            in C++ and Java. Watching Time Complexity / Asymptotic Notation lectures is not mastery.'
          order: 0
          prerequisites:
          - dsa-algorithmic-thinking
          learning_objective: Read and write simple big-O for loops and nested loops.
          mastery_criteria:
          - Explain the core idea without notes (language-independent).
          - Implement the pattern in Java without copying a solution.
          - State the C++ equivalent structure at a high level where it applies.
          - Solve 2–3 representative NeetCode 150 problems in the listed category.
          - 'Transfer: solve a similar unseen problem without hints.'
          - State time and space complexity of your approach.
          - Score >= 80% on topic questions.
          next_topic: dsa-best-worst-average
          fast_trackable: true
          lessons:
          - slug: dsa-big-o-core
            title: Big-O notation
            description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
              and deeper reasoning, not a first course in programming. Big-O describes asymptotic growth:
              constant factors and lower terms drop out. Count dominant operations in loops — one loop
              over n is O(n), nested loops often O(n²). This formalizes Domain 0''s complexity intro.
              Same reasoning in C++ and Java. Watching Time Complexity / Asymptotic Notation lectures
              is not mastery.'
            order: 0
            hours_estimated: 1.0
            resources:
            - slug: dsa-big-o-primary
              title: 'Abdul Bari Algorithms playlist — watch: Time Complexity / Asymptotic Notation'
              type: youtube_playlist
              url: https://www.youtube.com/playlist?list=PLDN4rrl48XKpZkf03iYFl-O29szjTrs_O
              provider: Abdul Bari
              role: PRIMARY
              description: 'Exact Abdul Bari video ID not verified this session. Use the official Algorithms
                playlist and watch the matching titled lecture. Do not use third-party reuploads. Target
                lecture: Time Complexity / Asymptotic Notation.'
              official: true
              order: 0
            - slug: dsa-big-o-mit
              title: MIT 6.006 Lecture 1 — Algorithms and Computation
              type: documentation
              url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/lecture-1-algorithms-and-computation/
              provider: MIT OCW 6.006
              role: DEEP_DIVE
              description: Optional MIT 6.006 lecture page. Not mandatory. Do not complete the entire
                course.
              official: true
              order: 1
            - slug: dsa-big-o-l19-mit
              title: MIT 6.006 Lecture 19 — Complexity
              type: documentation
              url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/lecture-19-complexity/
              provider: MIT OCW 6.006
              role: DEEP_DIVE
              description: Optional MIT 6.006 lecture page. Not mandatory. Do not complete the entire
                course.
              official: true
              order: 2
            questions:
            - slug: dsa-big-o-q1
              prompt: 'What is the time complexity of:

                for (int i = 0; i < n; i++) { sum += a[i]; }'
              options:
              - O(1)
              - O(log n)
              - O(n)
              - O(n²)
              answer: O(n)
              explanation: Single loop visits each element once.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-big-o-q2
              prompt: "What is the time complexity of:\nfor (int i = 0; i < n; i++)\n  for (int j = 0;\
                \ j < n; j++)\n    count++;"
              options:
              - O(n)
              - O(n log n)
              - O(n²)
              - O(2^n)
              answer: O(n²)
              explanation: Outer and inner both run n times.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-big-o-q3
              prompt: Why do we ignore constants in big-O?
              options:
              - Constants are illegal in Java.
              - As n grows, growth rate dominates fixed overhead.
              - Only recursive algorithms have constants.
              - Interviewers forbid constants.
              answer: As n grows, growth rate dominates fixed overhead.
              explanation: O(2n) and O(n) are both linear asymptotically.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-big-o-q4
              prompt: 'A binary search on a sorted array of size n is:'
              options:
              - O(n)
              - O(log n)
              - O(n log n)
              - O(1)
              answer: O(log n)
              explanation: Each step halves the search space.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-big-o-q5
              prompt: 'Space complexity counts:'
              options:
              - Only heap allocations in C++.
              - Extra memory used by the algorithm beyond input storage.
              - Lines of source code.
              - Number of public methods.
              answer: Extra memory used by the algorithm beyond input storage.
              explanation: Auxiliary space matters for large inputs.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-big-o-q6
              prompt: 'O(n) + O(n) simplified is:'
              options:
              - O(n²)
              - O(2n)
              - O(n)
              - O(log n)
              answer: O(n)
              explanation: Same order class; constants dropped.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: dsa-big-o-ex1
              title: Complexity classification
              instructions: 'IMPLEMENT: Write three Java methods: (1) find max in int[] — O(n); (2) print
                all pairs i<j — O(n²); (3) binary search on sorted int[] — O(log n). Stub bodies are fine
                if you annotate complexity above each. TRACE/EXPLAIN: For n=8, how many times does the
                inner loop run in the pair printer? SOLVE: From NeetCode 150 Arrays & Hashing, classify
                time/space for Valid Anagram and Two Sum after solving. TRANSFER (internal): A function
                scans an array once and uses a HashMap of size at most k — state time and auxiliary space
                in terms of n and k.'
              difficulty: intermediate
              order: 0
        - slug: dsa-best-worst-average
          name: Best, worst, average
          description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. The same algorithm can differ by
            input shape: quicksort is O(n log n) average but O(n²) worst on bad pivots. HashMap lookup
            is O(1) average but degrades with many collisions. Interviews usually ask worst-case unless
            stated otherwise. Abdul Bari''s Frequency Count / analysis lectures and MIT L19 deepen this
            — not mastery alone.'
          order: 1
          prerequisites:
          - dsa-big-o
          learning_objective: Distinguish best, worst, and average case; default to worst-case in interviews.
          mastery_criteria:
          - Explain the core idea without notes (language-independent).
          - Implement the pattern in Java without copying a solution.
          - State the C++ equivalent structure at a high level where it applies.
          - Solve 2–3 representative NeetCode 150 problems in the listed category.
          - 'Transfer: solve a similar unseen problem without hints.'
          - State time and space complexity of your approach.
          - Score >= 80% on topic questions.
          next_topic: dsa-array-traversal
          fast_trackable: true
          lessons:
          - slug: dsa-best-worst-average-core
            title: Best, worst, average
            description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
              and deeper reasoning, not a first course in programming. The same algorithm can differ by
              input shape: quicksort is O(n log n) average but O(n²) worst on bad pivots. HashMap lookup
              is O(1) average but degrades with many collisions. Interviews usually ask worst-case unless
              stated otherwise. Abdul Bari''s Frequency Count / analysis lectures and MIT L19 deepen this
              — not mastery alone.'
            order: 0
            hours_estimated: 0.75
            resources:
            - slug: dsa-best-worst-average-primary
              title: 'Abdul Bari Algorithms playlist — watch: Frequency Count / case analysis'
              type: youtube_playlist
              url: https://www.youtube.com/playlist?list=PLDN4rrl48XKpZkf03iYFl-O29szjTrs_O
              provider: Abdul Bari
              role: PRIMARY
              description: 'Exact Abdul Bari video ID not verified this session. Use the official Algorithms
                playlist and watch the matching titled lecture. Do not use third-party reuploads. Target
                lecture: Frequency Count / case analysis.'
              official: true
              order: 0
            - slug: dsa-best-worst-average-mit
              title: MIT 6.006 Lecture 19 — Complexity
              type: documentation
              url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/lecture-19-complexity/
              provider: MIT OCW 6.006
              role: DEEP_DIVE
              description: Optional MIT 6.006 lecture page. Not mandatory. Do not complete the entire
                course.
              official: true
              order: 1
            questions:
            - slug: dsa-best-worst-average-q1
              prompt: 'Linear search for a target in an unsorted array has worst-case time:'
              options:
              - O(1)
              - O(log n)
              - O(n)
              - O(n²)
              answer: O(n)
              explanation: Target may be last or absent — scan all n.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-best-worst-average-q2
              prompt: 'HashMap.get in Java is typically quoted as O(1) because:'
              options:
              - It is always exactly one CPU instruction.
              - Average-case expected constant time under good hashing.
              - It uses a tree internally.
              - Keys are always integers.
              answer: Average-case expected constant time under good hashing.
              explanation: Worst-case can degrade with collisions; interviews often say expected O(1).
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-best-worst-average-q3
              prompt: 'When an interviewer asks ''complexity?'' without qualification, assume:'
              options:
              - Best case
              - Average case only
              - Worst case
              - Amortized case only for arrays
              answer: Worst case
              explanation: Worst-case bounds are the safe default unless they specify average/amortized.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-best-worst-average-q3b
              prompt: 'Inserting at index 0 in ArrayList is O(n) worst-case because:'
              options:
              - Java recompiles the class.
              - Elements right of index 0 shift by one position.
              - Hashing is required.
              - ArrayList cannot insert.
              answer: Elements right of index 0 shift by one position.
              explanation: Contiguous storage requires shifting — same as vector insert at front in C++.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-best-worst-average-q4
              prompt: 'Amortized O(1) append on ArrayList means:'
              options:
              - Every single append is O(1) worst-case.
              - Over many appends, average cost per append is constant though occasional resizes cost
                O(n).
              - Append is impossible.
              - Only works for sorted data.
              answer: Over many appends, average cost per append is constant though occasional resizes
                cost O(n).
              explanation: Dynamic array doubling gives amortized constant append.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-best-worst-average-q5
              prompt: 'Best case for finding a target at index 0 in unsorted array:'
              options:
              - O(1)
              - O(log n)
              - O(n)
              - O(n²)
              answer: O(1)
              explanation: One comparison succeeds immediately — best ≠ worst.
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: dsa-best-worst-average-ex1
              title: Case analysis
              instructions: 'IMPLEMENT: Write Java linearSearch(int[] a, int target) returning index or
                -1. TRACE/EXPLAIN: State best, worst, and average comparisons for random target not in
                array. SOLVE: After solving Contains Duplicate from NeetCode 150 Arrays & Hashing, state
                best/worst for sort-based vs HashSet-based approaches. TRANSFER (internal): Inserting
                into a sorted ArrayList at random positions — describe worst-case per insert and for n
                inserts.'
              difficulty: intermediate
              order: 0
      - slug: mod-dsa-arrays
        name: Arrays
        order: 2
        topics:
        - slug: dsa-array-traversal
          name: Array traversal
          description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. Traversal is index-driven linear
            scan: forward, backward, or with a step. Java int[] / ArrayList ≈ C++ vector (ArrayList grows;
            raw arrays are fixed). Use enhanced for when you only need values; use index loops when you
            need i or in-place writes. No Domain 1 array syntax lesson — focus on algorithmic scans.'
          order: 0
          prerequisites:
          - dsa-best-worst-average
          - java-arrays
          learning_objective: Scan an array in linear time without unnecessary copying.
          mastery_criteria:
          - Explain the core idea without notes (language-independent).
          - Implement the pattern in Java without copying a solution.
          - State the C++ equivalent structure at a high level where it applies.
          - Solve 2–3 representative NeetCode 150 problems in the listed category.
          - 'Transfer: solve a similar unseen problem without hints.'
          - State time and space complexity of your approach.
          - Score >= 80% on topic questions.
          next_topic: dsa-array-insert-delete
          fast_trackable: true
          lessons:
          - slug: dsa-array-traversal-core
            title: Array traversal
            description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
              and deeper reasoning, not a first course in programming. Traversal is index-driven linear
              scan: forward, backward, or with a step. Java int[] / ArrayList ≈ C++ vector (ArrayList
              grows; raw arrays are fixed). Use enhanced for when you only need values; use index loops
              when you need i or in-place writes. No Domain 1 array syntax lesson — focus on algorithmic
              scans.'
            order: 0
            hours_estimated: 0.75
            resources:
            - slug: dsa-array-traversal-primary
              title: 'Abdul Bari Algorithms playlist — watch: Arrays / array analysis'
              type: youtube_playlist
              url: https://www.youtube.com/playlist?list=PLDN4rrl48XKpZkf03iYFl-O29szjTrs_O
              provider: Abdul Bari
              role: PRIMARY
              description: 'Exact Abdul Bari video ID not verified this session. Use the official Algorithms
                playlist and watch the matching titled lecture. Do not use third-party reuploads. Target
                lecture: Arrays / array analysis.'
              official: true
              order: 0
            - slug: dsa-array-traversal-mit
              title: MIT 6.006 Lecture 2 — Data Structures and Dynamic Arrays
              type: documentation
              url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/resources/lecture-2-data-structures-and-dynamic-arrays/
              provider: MIT OCW 6.006
              role: DEEP_DIVE
              description: Optional MIT 6.006 lecture page. Not mandatory. Do not complete the entire
                course.
              official: true
              order: 1
            - slug: dsa-array-traversal-nccore
              title: NeetCode Core Skills — Design Dynamic Array
              type: coding_problem
              url: https://neetcode.io/practice/practice/coreSkills
              provider: NeetCode
              role: PRACTICE
              description: Implement Design Dynamic Array from Core Skills. Java primary. This is implementation,
                not video mastery.
              official: true
              order: 2
            - slug: dsa-array-traversal-nc150
              title: NeetCode 150 — Arrays & Hashing (representative subset)
              type: coding_problem
              url: https://neetcode.io/practice/practice/neetcode150
              provider: NeetCode
              role: PRACTICE
              description: Open the Arrays & Hashing section. Solve only the small representative subset
                listed in the exercise — not all 150.
              official: true
              order: 3
            questions:
            - slug: dsa-array-traversal-q1
              prompt: What is the time to find the maximum of int[] a of length n?
              options:
              - O(1)
              - O(log n)
              - O(n)
              - O(n²)
              answer: O(n)
              explanation: Must examine each element once in the worst case.
              difficulty: medium
              mastery_requirement: true
            - slug: dsa-array-traversal-q2
              prompt: 'Trace: int[] a = {3,1,4}; int s=0; for (int x : a) s+=x; Final s?'
              options:
              - '3'
              - '4'
              - '7'
              - '8'
              answer: '8'
              explanation: 3+1+4=8.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-array-traversal-q3
              prompt: When must you use an indexed for-loop instead of enhanced for?
              options:
              - Never — enhanced for is always faster.
              - When you need the index, modify elements in place, or scan two indices.
              - Only for char arrays.
              - Only when array length exceeds 1000.
              answer: When you need the index, modify elements in place, or scan two indices.
              explanation: Enhanced for gives values only; in-place updates need indices.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-array-traversal-q4
              prompt: 'Reverse traversal from n-1 down to 0 is still:'
              options:
              - O(1)
              - O(log n)
              - O(n)
              - O(n²)
              answer: O(n)
              explanation: Direction does not change linear scan cost.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-array-traversal-q5
              prompt: 'Copying an entire int[] before scanning when mutation is forbidden costs:'
              options:
              - O(1) time
              - O(n) extra space
              - O(n²) time
              - No space
              answer: O(n) extra space
              explanation: A copy is linear auxiliary space.
              difficulty: medium
              mastery_requirement: false
            - slug: dsa-array-traversal-q6
              prompt: 'In C++ you used vector indexing; in Java raw int[] indexing:'
              options:
              - Uses pointers like C++.
              - Uses 0-based int indices with bounds checking on access.
              - Is 1-based.
              - Requires .at(i) only.
              answer: Uses 0-based int indices with bounds checking on access.
              explanation: Same 0-based mental model; Java checks bounds on a[i].
              difficulty: medium
              mastery_requirement: false
            exercises:
            - slug: dsa-array-traversal-ex1
              title: Linear scans
              instructions: 'IMPLEMENT: max(int[]), countEvens(int[]), and reverseInPlace(int[]) in Java.
                TRACE/EXPLAIN: Dry-run reverseInPlace on [1,2,3,4] showing indices each swap. SOLVE: NeetCode
                150 Arrays & Hashing — Product of Array Except Self and Valid Sudoku. TRANSFER (internal):
                Given daily temperatures, find days until warmer — name naive O(n²) and the later pattern
                that improves it.'
              difficulty: intermediate
              order: 0
        - slug: dsa-array-insert-delete
          name: Insertion and deletion concepts
          description: You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. Contiguous arrays shift elements
            on middle insert/delete — O(n) worst case. ArrayList append is amortized O(1); insert at index
            i costs O(n-i). Java int[] / ArrayList ≈ C++ vector (ArrayList grows; raw arrays are fixed).
            Same shifting intuition as C++ vector.
          order: 1
