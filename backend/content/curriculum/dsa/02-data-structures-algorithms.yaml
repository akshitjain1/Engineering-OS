        topics:
        - slug: dsa-mst
          name: MST
          description: You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. An MST connects all vertices with
            minimum total edge weight and has no cycles. Kruskal sorts edges and adds light edges that
            do not form a cycle (union-find detects cycles). Prim grows a tree from a start vertex using
            a min-heap of frontier edges. Both are greedy on safe light edges. Implement in Java. C++
            is an equivalence note, not a second curriculum. Java PriorityQueue is a min-heap by default.
            C++ priority_queue is a max-heap by default. Invert with Comparator / greater<>. Union-find
            from the prior topic is Kruskal's cycle check.
