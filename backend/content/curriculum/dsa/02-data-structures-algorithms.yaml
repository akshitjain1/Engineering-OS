        - slug: dsa-monotonic-stack
          name: Monotonic stack
          description: 'You already know DSA in C++. This is a rebuild of fundamentals for Java interviews
            and deeper reasoning, not a first course in programming. A monotonic stack keeps elements
            in sorted order (increasing or decreasing) as you scan. It is a pattern on top of a normal
            stack, not a new ADT. Classic use: next greater element — when you see a larger value, pop
            smaller indices from the stack because their ''next greater'' is now known. Each element is
            pushed and popped at most once → O(n). Java: still `ArrayDeque` storing indices or values.
            C++: same with `std::stack` or a vector used as stack.'
