# Python core self-check questions.
#
# Each topic's questions are answerable from that topic's PRIMARY resource and
# stay inside that topic's scope. The bias is towards the bugs these features
# actually cause in working code, not towards definitions.
schema_version: 1
kind: question_bank
module: mod-py-core
topics:
  - topic: py-syntax
    # Source: docs.python.org/3/tutorial/index.html - running scripts, venv, pip
    questions:
      - id: py-venv-isolation
        prompt: "You run `python -m venv .venv`, activate it, then `pip install pandas`. Where does pandas end up?"
        options:
          - "Inside the .venv site-packages directory, visible only to that interpreter"
          - "In the system-wide site-packages, because pip always installs for all projects"
          - "In the project root beside your scripts, vendored so the code stays portable"
          - "In a user-level package cache that every environment on the machine shares"
        answer: "Inside the .venv site-packages directory, visible only to that interpreter"
        explanation: >-
          A virtual environment has its own site-packages, which is the whole point: the install is
          scoped to that interpreter. A global install is exactly what venv exists to prevent, pip
          never vendors packages into your source tree, and although the wheel download cache is
          shared, the installed packages themselves are not.
        difficulty: beginner
      - id: py-lockfile-vs-loose-requirements
        prompt: "A requirements file lists pandas and scikit-learn with no version pins. Why can the same file produce two different environments?"
        options:
          - "The resolver picks the newest compatible releases at install time, so the set drifts"
          - "Packages install in a random order, and that ordering changes which versions win"
          - "Virtual environments deliberately vary versions so that version bugs surface early"
          - "The file is advisory only, and the installer ignores any name that is not pinned"
        answer: "The resolver picks the newest compatible releases at install time, so the set drifts"
        explanation: >-
          Unpinned requirements are a request, resolved fresh on every machine and every day. A
          lockfile records the exact resolved version of every direct and transitive dependency, which
          is what makes an install reproducible. Install order does not change version selection,
          nothing randomises versions on purpose, and the installer does read every listed name.
        difficulty: intermediate
        mastery: true
      - id: py-pip-interpreter-mismatch
        prompt: "An import fails inside your activated environment even though the install reported success. What is the most likely cause?"
        options:
          - "The pip on PATH belongs to another interpreter, so `python -m pip` is the safe form"
          - "The distribution name differs from the import name, so the module cannot be found"
          - "Newly installed packages need a shell restart before any import statement sees them"
          - "Activation makes the environment read-only, so the install went to the global one"
        answer: "The pip on PATH belongs to another interpreter, so `python -m pip` is the safe form"
        explanation: >-
          Installing with one interpreter and importing with another is the classic mismatch, and
          running pip as a module of the interpreter you actually use removes the ambiguity. Name
          mismatches exist but produce a different error, imports need no shell restart because the
          path is read per process, and activation does not make anything read-only.
        difficulty: intermediate
      - id: py-float-equality-check
        prompt: "Why does the expression 0.1 + 0.2 == 0.3 evaluate to False?"
        options:
          - "Binary floating point cannot represent those decimals exactly, so a tiny error remains"
          - "Python evaluates the addition lazily and compares the unevaluated expressions instead"
          - "The equality operator compares object identity for floats rather than numeric value"
          - "Python rounds every float to a fixed number of decimals before comparing them at all"
        answer: "Binary floating point cannot represent those decimals exactly, so a tiny error remains"
        explanation: >-
          The sum is very slightly greater than 0.3 in binary, so compare with math.isclose or an
          explicit tolerance instead. Arithmetic in Python is eager rather than lazy, equality on
          floats compares numeric value and not identity, and no automatic rounding is applied to the
          operands before the comparison happens.
        difficulty: beginner
      - id: py-truthiness-versus-none
        prompt: "A helper returns either a list of rows or None. Why is testing it with a plain truthiness check risky?"
        options:
          - "An empty list is falsy, so a successful empty result takes the same branch as None"
          - "Lists are always truthy, so the None branch never runs even when None is returned"
          - "Truth testing a list copies it first, which is too slow for large query results"
          - "An if statement cannot test a list directly and raises a TypeError at runtime"
        answer: "An empty list is falsy, so a successful empty result takes the same branch as None"
        explanation: >-
          Zero, the empty string, the empty list and the empty dict are all falsy, so a truthiness
          check conflates nothing found with nothing returned. Comparing against None separates the two
          cases. Empty containers are not truthy, truth testing copies nothing, and lists are perfectly
          valid conditions.
        difficulty: intermediate
        mastery: true

  - topic: py-data-structures
    # Source: docs.python.org/3/tutorial/datastructures.html
    questions:
      - id: py-identity-versus-equality-lists
        prompt: "Given two separately built lists holding 1 and 2, what do the equality and identity comparisons between them return?"
        options:
          - "Equality is True and identity is False, because equality compares contents"
          - "Both are True, because two lists with the same contents are one object"
          - "Both are False, because list comparison always compares memory addresses"
          - "Equality is False and identity is True, because identity compares values"
        answer: "Equality is True and identity is False, because equality compares contents"
        explanation: >-
          Equality asks whether the contents match, while identity asks whether both names refer to one
          and the same object, which is only true after an assignment that aliases it. Equal contents
          never merge two lists into one object, list comparison is element-wise rather than
          address-based, and identity has nothing to do with values.
        difficulty: beginner
      - id: py-repeated-inner-list-aliasing
        prompt: "You build a grid by multiplying a row list by 2, then write to the first cell of the first row. What does the grid hold?"
        options:
          - "Both rows show the write, because repetition stored one inner list twice"
          - "Only the first row shows it, because repetition copied the inner list"
          - "Only one row remains, because the write replaced the second row entirely"
          - "A TypeError, because a list built by repetition cannot be modified later"
        answer: "Both rows show the write, because repetition stored one inner list twice"
        explanation: >-
          Sequence repetition copies references, not objects, so every row is the same list. Build
          nested structures with a comprehension so each row is created separately. Repetition never
          deep-copies, assigning to a cell removes no rows, and lists produced by repetition are
          ordinary mutable lists.
        difficulty: intermediate
        mastery: true
      - id: py-mutate-list-while-iterating
        prompt: "You iterate over a list and call remove on some of its elements inside the loop. What goes wrong?"
        options:
          - "The index moves past the neighbour of each removed item, so entries survive"
          - "Python raises a RuntimeError at once, the way it does for a mutated dict"
          - "Nothing goes wrong, because iteration snapshots the list before it starts"
          - "Every element after the first removal is visited twice, duplicating work"
        answer: "The index moves past the neighbour of each removed item, so entries survive"
        explanation: >-
          The list iterator tracks a position, and removing shifts later elements down into a position
          already passed, so items are skipped silently. Iterate over a copy or build a new list with a
          comprehension. Lists do not raise on mutation the way dicts do, nothing is snapshotted, and
          elements are skipped rather than repeated.
        difficulty: intermediate
        mastery: true
      - id: py-sort-returns-none
        prompt: "Assigning the result of calling sort on a list leaves the target holding None. Why, and what should you write instead?"
        options:
          - "sort orders the list in place and returns None, so use sorted for a new list"
          - "sort requires a key argument and returns None whenever that argument is absent"
          - "sort returns None for numeric lists only, and returns a new list for strings"
          - "The list was empty, and sorting an empty list is what produces None as a result"
        answer: "sort orders the list in place and returns None, so use sorted for a new list"
        explanation: >-
          Methods that mutate in place return None by convention, which is why the name ends up empty;
          the built-in sorted returns a new sorted list instead. The key argument is optional, the
          return type does not depend on element type, and sorting an empty list returns None for
          exactly the same in-place reason.
        difficulty: beginner
      - id: py-unhashable-dict-key
        prompt: "Why does using a list as a dictionary key raise TypeError while a tuple of the same values works?"
        options:
          - "Keys must be hashable, and mutable objects such as lists are unhashable"
          - "Dictionaries keep keys sorted, and lists cannot be ordered against each other"
          - "Lists are too large to hash, so only fixed-size containers can act as keys"
          - "Only strings and numbers can be keys, so the tuple is converted to a string"
        answer: "Keys must be hashable, and mutable objects such as lists are unhashable"
        explanation: >-
          A key's hash must stay stable for the lookup to keep working, so mutable containers refuse to
          provide one, while a tuple of hashable items is itself hashable. Dictionaries preserve
          insertion order rather than sorting, size is irrelevant, and a tuple key is stored as a tuple
          and never stringified.
        difficulty: intermediate

  - topic: py-functions-modules
    # Source: docs.python.org/3/tutorial/modules.html plus function definition
    questions:
      - id: py-mutable-default-argument
        prompt: "A function takes a parameter defaulting to an empty list and appends to it before returning. What does the second call return?"
        options:
          - "Both items, because the default list is created once when the function is defined"
          - "Only the new item, because a fresh empty list is constructed on every single call"
          - "A SyntaxError, because a mutable literal cannot be used as a parameter default"
          - "Both items only when the caller passes the same argument value a second time"
        answer: "Both items, because the default list is created once when the function is defined"
        explanation: >-
          Defaults are evaluated once at definition time and stored on the function object, so a mutable
          default accumulates across calls. Use None as the default and build the list inside the body.
          Nothing is reconstructed per call, mutable defaults are legal syntax, and the accumulation
          happens precisely when no argument is passed.
        difficulty: intermediate
        mastery: true
      - id: py-closure-late-binding
        prompt: "You build a list of zero-argument lambdas inside a loop over range(3), then call the first one. What does it return?"
        options:
          - "2, because each lambda looks up the loop variable when called, after the loop ends"
          - "0, because the lambda captured the value of the loop variable when it was created"
          - "A NameError, because the loop variable no longer exists once the loop has finished"
          - "A different value per call, because calling the lambda re-runs the enclosing loop"
        answer: "2, because each lambda looks up the loop variable when called, after the loop ends"
        explanation: >-
          Closures capture the variable, not its value, so every lambda sees the final binding. Bind it
          eagerly with a default argument or with functools.partial. Values are not snapshotted at
          creation, the variable stays alive in the closure cell rather than disappearing, and calling a
          lambda never re-executes the loop that built it.
        difficulty: advanced
        mastery: true
      - id: py-module-main-guard
        prompt: "A training script calls its main function at module level. What happens when another module imports that script?"
        options:
          - "Training starts during the import, because module-level code runs when imported"
          - "Nothing runs, because Python executes a file only when it is the entry point"
          - "The import fails with a RecursionError caused by calling a function too early"
          - "Only the definitions run, and the main call is deferred until it is reached"
        answer: "Training starts during the import, because module-level code runs when imported"
        explanation: >-
          Importing a module executes its top level once, so any unguarded call runs as a side effect of
          the import. Guarding it with a check on the module name keeps the file importable. Python does
          not skip top-level statements on import, there is no recursion involved, and calls at module
          level are not deferred.
        difficulty: beginner
      - id: py-import-star-namespace
        prompt: "What is the practical risk of importing everything from a helper module with a star import?"
        options:
          - "It binds unknown names in your namespace and can silently shadow existing ones"
          - "It imports the module twice, doubling the cost of any module-level setup code"
          - "It skips the package initialiser, so subpackages are never properly set up"
          - "It makes the imported names read-only, so you cannot rebind them afterwards"
        answer: "It binds unknown names in your namespace and can silently shadow existing ones"
        explanation: >-
          A star import pulls in whatever the module exposes, so a later definition of the same name
          wins and the origin of a symbol becomes unreadable; explicit imports or a declared export list
          keep it controlled. Nothing is imported twice, package initialisers still run, and imported
          names are ordinary rebindable bindings.
        difficulty: intermediate
      - id: py-module-cached-once
        prompt: "You edit a helper module during a long interactive session, import it again, and the old behaviour persists. Why?"
        options:
          - "The first import cached the module object, so the source file is not read again"
          - "Imports are compiled into the process and can never change while it keeps running"
          - "The bytecode cache directory is permanent, so edits need it deleted by hand first"
          - "File edits take effect only once the virtual environment has been reactivated"
        answer: "The first import cached the module object, so the source file is not read again"
        explanation: >-
          A module is executed once and then served from the interpreter's module cache, so repeating
          the import is a no-op; use importlib.reload or restart the process. Nothing is permanently
          frozen into the process, the bytecode cache is invalidated by timestamp so it is not the
          cause, and reactivating the environment changes nothing.
        difficulty: intermediate

  - topic: py-oop
    # Source: docs.python.org/3/tutorial/classes.html
    questions:
      - id: py-class-attribute-shared-state
        prompt: "A class defines an empty list in its class body, and every instance appends to it through self. What is the effect?"
        options:
          - "All instances append to one shared list, because the attribute lives on the class"
          - "Each instance gets its own list, because access through self makes a private copy"
          - "The append raises AttributeError until the attribute is set in the initialiser"
          - "The list is shared only among instances created inside the same function scope"
        answer: "All instances append to one shared list, because the attribute lives on the class"
        explanation: >-
          Attribute lookup falls back to the class, so self finds the single class-level list and
          mutates it for everyone; per-instance state belongs in the initialiser. Reading through self
          never copies the object, the attribute already exists so no AttributeError is raised, and the
          scope where instances are created is irrelevant.
        difficulty: intermediate
        mastery: true
      - id: py-instance-shadows-class-attr
        prompt: "A class has an integer counter in its class body and a method that increments it through self. What does that statement actually do?"
        options:
          - "It reads the class value, then binds a new instance attribute holding the sum"
          - "It increments the class attribute itself, so the count is shared by all instances"
          - "It raises UnboundLocalError, because the counter was never set on the instance"
          - "It increments the class attribute and a separate instance attribute together"
        answer: "It reads the class value, then binds a new instance attribute holding the sum"
        explanation: >-
          Augmented assignment on an immutable value is a read followed by an assignment, and the
          assignment always targets the instance, so the class counter never moves. Name the class
          explicitly for a shared counter. This is why mutating a class-level list is shared while
          incrementing a class-level integer is not, and no error is raised.
        difficulty: advanced
        mastery: true
      - id: py-super-init-chain
        prompt: "A subclass defines its own initialiser and never calls the base class initialiser. What is the consequence?"
        options:
          - "The base setup never runs, so attributes it would have defined are missing later"
          - "Python calls the base initialiser automatically before the subclass body executes"
          - "Instantiation fails immediately with a TypeError about the missing base call"
          - "The base attributes exist but hold their class-level defaults rather than values"
        answer: "The base setup never runs, so attributes it would have defined are missing later"
        explanation: >-
          Overriding replaces the base initialiser rather than extending it, and the failure surfaces
          much later as a missing attribute. Call it cooperatively through super instead. Python does
          not chain initialisers for you, instantiation succeeds without complaint, and unassigned
          attributes are absent rather than falling back to defaults.
        difficulty: intermediate
      - id: py-name-mangling-not-private
        prompt: "What does a leading double underscore on an attribute name actually guarantee?"
        options:
          - "Nothing is blocked; the name is rewritten with the class name to avoid collisions"
          - "Access from outside the class raises AttributeError, giving the object true privacy"
          - "The attribute becomes read-only once the initialiser has finished running on it"
          - "The attribute is hidden from introspection and left out of the instance dictionary"
        answer: "Nothing is blocked; the name is rewritten with the class name to avoid collisions"
        explanation: >-
          Name mangling exists so a subclass cannot accidentally clobber a base class attribute, and the
          mangled name is still reachable from anywhere. Python enforces no access control, so no
          AttributeError is raised, nothing becomes read-only, and the attribute appears in the instance
          dictionary under its mangled spelling.
        difficulty: intermediate
      - id: py-composition-over-inheritance
        prompt: "A trainer class needs to log metrics. Why is holding a logger object usually better than inheriting from a logger base class?"
        options:
          - "A trainer has a logger rather than being one, and the part can be swapped freely"
          - "Inheritance costs more at runtime, because lookups must walk the whole class tree"
          - "Python forbids inheriting from more than one base, so composition is the only route"
          - "Composition means the logger no longer has to expose any stable interface at all"
        answer: "A trainer has a logger rather than being one, and the part can be swapped freely"
        explanation: >-
          Inheritance claims an is-a relationship and drags the base interface into your public surface,
          while composition keeps the collaborator replaceable, including by a fake in tests. Lookup
          cost is not the reason, Python does support multiple inheritance, and a collaborator still
          needs an interface you can depend on.
        difficulty: intermediate

  - topic: py-testing
    # Source: docs.pytest.org/en/stable/ - getting started, fixtures, parametrize
    questions:
      - id: pytest-plain-assert-rewriting
        prompt: "Why can a pytest test use a bare assert statement and still get a detailed failure message?"
        options:
          - "pytest rewrites assert statements at import so it can report both sides of the comparison"
          - "Python's own assert prints the value of every operand whenever the condition fails"
          - "pytest supplies a replacement assert helper that each test module has to import first"
          - "The detail comes from the traceback, so any assert under any runner shows the values"
        answer: "pytest rewrites assert statements at import so it can report both sides of the comparison"
        explanation: >-
          Assertion rewriting happens when pytest imports the test module, which is why no special
          assertion methods are needed. Plain Python prints only the optional message, there is nothing
          to import because the rewriting is automatic, and a traceback alone shows the failing line
          without the operand values.
        difficulty: beginner
        mastery: true
      - id: pytest-fixture-scope-shared-state
        prompt: 'A fixture declared with scope="module" returns a mutable dict, and one test writes into it. What risk does that create?'
        options:
          - "Later tests observe the write, so results depend on the order the tests happen to run"
          - "The fixture is rebuilt for each test regardless, so the declared scope changes nothing"
          - "pytest deep-copies fixture values between tests, which hides genuine mutation bugs"
          - "Module scope makes the returned object immutable, so the write silently does nothing"
        answer: "Later tests observe the write, so results depend on the order the tests happen to run"
        explanation: >-
          A module-scoped fixture is built once and handed to every test in the file, so mutation leaks
          between them and a test can pass alone but fail in a suite. Keep shared fixtures read-only or
          use the default function scope. pytest never copies fixture values, and no scope makes a
          returned object immutable.
        difficulty: advanced
        mastery: true
      - id: pytest-raises-context-manager
        prompt: "How should a test assert that a loader raises FileNotFoundError, and why is a bare try and except not enough?"
        options:
          - "Use the raises context manager, because a try and except passes when nothing raises"
          - "Use a try and except that returns early, because a caught exception counts as a pass"
          - "Compare the return value against the exception class, which is what the runner checks"
          - "Mark the test as expected to fail, which is the supported way to require an exception"
        answer: "Use the raises context manager, because a try and except passes when nothing raises"
        explanation: >-
          The raises helper fails the test when the block completes without the exception, which is the
          case a hand-written except clause silently lets through. Returning early makes the missing
          exception invisible, the call raises rather than returning the class, and an expected-failure
          marker records a broken test rather than asserting a specific exception.
        difficulty: intermediate
      - id: pytest-discovery-rules
        prompt: "pytest reports that no tests ran for a file full of checks. Which naming rule is most likely broken?"
        options:
          - "Test files and test functions must match the test-prefixed names pytest collects"
          - "Test modules have to live in a directory named tests before pytest looks inside"
          - "Every test module needs a package initialiser file before pytest is able to import it"
          - "Each test function has to carry a marker decorator in order to be collected at all"
        answer: "Test files and test functions must match the test-prefixed names pytest collects"
        explanation: >-
          Collection is name-driven: modules matching the test file pattern, and inside them functions
          or classes carrying the test prefix. The directory name is not part of the rule, a package
          initialiser is optional and only affects import mode, and no marker is required to make a
          function collectable.
        difficulty: beginner
      - id: pytest-parametrize-versus-loop
        prompt: "Why is the parametrize marker preferable to looping over a list of cases inside a single test function?"
        options:
          - "Each case becomes its own test, so a failure names the input and later cases still run"
          - "A loop body cannot use assert statements, so it silently reports nothing whatsoever"
          - "Parametrized cases run in parallel by default, which is the main reason to prefer them"
          - "Parametrize is mandatory whenever a test needs more than one input value to check"
        answer: "Each case becomes its own test, so a failure names the input and later cases still run"
        explanation: >-
          The first failing assert aborts a loop, so you lose every case after it and the report does
          not say which input broke; parametrize turns each case into a separately reported test. Loops
          can use assert perfectly well, parallelism needs a separate plugin, and parametrize is a
          convenience rather than a requirement.
        difficulty: intermediate
